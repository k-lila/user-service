server:
  port: ${SERVER_PORT:8888}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: config-server
  # Basic auth (C17 / G3). Default dev para `docker compose up` / `mvn spring-boot:run`
  # funcionarem sem setup; em prod sobrescrever via env. Os clientes enviam as mesmas
  # credenciais em spring.cloud.config.username/password.
  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:config-client}
      password: ${CONFIG_SERVER_PASSWORD:config-dev-secret}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
