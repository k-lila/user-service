server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 5000

    gateway:
      default-filters:
        - TokenRelay

  security:
    oauth2:
      client:
        registration:
          gateway-client:
            provider: authorization-server
            client-id: ${OAUTH_CLIENT_ID:gateway-client}
            client-secret: ${OAUTH_CLIENT_SECRET:gateway-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/gateway-client"
            scope:
              - openid
              - profile

        provider:
          authorization-server:
            issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}

      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
    urls:
      - name: user-service
        url: /v3/api-docs/user

    oauth:
      client-id: ${OAUTH_CLIENT_ID:gateway-client}
      client-secret: ${OAUTH_CLIENT_SECRET:gateway-secret}
      use-pkce-with-authorization-code-grant: true
    oauth2-redirect-url: ${OAUTH2SWAGGER_REDIRECT_URL:http://localhost:8081/swagger-ui/oauth2-redirect.html}

management:
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true

  endpoint:
    gateway:
      enabled: true
    prometheus:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
