server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # Atrás da borda (Cloudflare Tunnel / proxy TLS), o WebFlux consome o X-Forwarded-For e o
  # remoteAddress passa a refletir o IP do cliente — fallback do rate limit quando o header
  # confiável de IP está ausente. Default framework é seguro sem proxy (sem XFF = socket).
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: gateway
  # WebFlux é reativo: o MDC só recebe traceId/spanId (logging.pattern.level) se a
  # propagação automática de contexto do Reactor estiver ativa. Sem isso, os logs do
  # gateway saem com traceId vazio e a correlação log↔Zipkin quebra no edge.
  reactor:
    context-propagation: auto
  data:
    redis:
      # Autenticação nos data nodes (spring.data.redis.password) e nos sentinels
      # (spring.data.redis.sentinel.password) — propriedades distintas no Spring Boot 4.0.
      password: ${REDIS_PASSWORD}
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
        password: ${REDIS_PASSWORD}
  # TTL de sessão explícito (default implícito do Spring Session é 30m de inatividade).
  # Mantém 30m, mas torna a decisão visível e sobrescrevível por ambiente.
  session:
    timeout: ${SESSION_TIMEOUT:30m}

  cloud:
    # TERCEIRA camada de atraso de convergência, além das duas do Eureka: o Spring Cloud
    # LoadBalancer cacheia a lista de instâncias resolvida do `lb://` e o default é 35s.
    # Sem baixar isto, tunar só os timings do Eureka não entrega o ganho — o roteador continua
    # servindo a lista velha do cache.
    loadbalancer:
      cache:
        ttl: 5s
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 5000
    gateway:
      server:
        webflux:
          # Regressão SCG 5.0.0 (ADR-019): sem esta propriedade, XForwardedHeadersFilter E
          # ForwardedHeadersFilter não são registrados — o auth-server não recebe
          # X-Forwarded-Host/Proto e constrói Location com o hostname interno do container.
          # Valor: regex compilado por TrustedProxies.from(String), avaliado com Pattern.matches
          # (match total, ancorado) contra o IP do peer imediato. RFC1918 amplo: machine-agnostic
          # (a subnet Docker não é fixa). Seguro apenas com G10 fechado (portas do host removidas
          # da base do compose). Interdependência documentada no ADR-019.
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:10\..*|172\.(1[6-9]|2[0-9]|3[01])\..*|192\.168\..*}
          x-forwarded:
            # Habilita só host + proto (mínimo para o auth-server reconstruir a URL correta).
            # X-Forwarded-For desabilitado: sua proliferação criaria ambiguidade com
            # CF-Connecting-IP (fonte primária do rate limit e lockout por ADR-010).
            # port e prefix desabilitados: sem uso downstream.
            # append: false em host e proto: o nginx já envia X-Forwarded-Proto: https;
            # com append:true o filtro acrescentaria ao header existente (resultado: "https, http").
            # Com append:false, sobrescreve com o valor derivado do header recebido.
            for-enabled: false
            for-append: false
            host-enabled: true
            host-append: false
            port-enabled: false
            port-append: false
            proto-enabled: true
            proto-append: false
            prefix-enabled: false
            prefix-append: false

  security:
    oauth2:
      client:
        registration:
          gateway-client:
            provider: authorization-server
            client-id: ${OAUTH_CLIENT_ID:gateway-client}
            client-secret: ${OAUTH_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/gateway-client}"
            scope:
              - openid
              - profile

        provider:
          authorization-server:
            # Back-channel (gateway → auth-server): discovery, token e jwks.
            issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}
            # Front-channel (browser → auth-server): precisa ser alcançável pelo navegador.
            # Sobrescreve só o endpoint de autorização; token/jwks seguem o issuer-uri.
            authorization-uri: ${OAUTH_AUTHORIZATION_URI:http://localhost:8082/oauth2/authorize}

      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}

# CORS na borda (C12): origens permitidas configuráveis por ambiente (CSV).
# Default dev http://localhost:5173; prod sobrescreve via CORS_ALLOWED_ORIGINS.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Header de IP confiável injetado pela borda (Cloudflare sobrescreve CF-Connecting-IP).
# Fonte primária do particionamento por IP do rate limit — não-falsificável pois só a borda
# alcança o gateway. Esvaziar/trocar para deploy não-Cloudflare (cai no XFF via forward-headers).
security:
  trusted-client-ip-header: ${TRUSTED_CLIENT_IP_HEADER:CF-Connecting-IP}
  # Revogação ativa de token na borda (ADR-017, defesa em profundidade): inspeciona o access token
  # da sessão e rejeita (401) quando emitido antes do epoch de revogação do titular. key-prefix deve
  # casar com o do user-service (que grava o epoch).
  revocation:
    enabled: ${TOKEN_REVOCATION_ENABLED:true}
    key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:revoke:user:}

eureka:
  # Timings de convergência — mesmos valores dos demais serviços (racional em user-service.yml).
  # Aqui andam junto com o spring.cloud.loadbalancer.cache.ttl acima: os três knobs formam a
  # latência total entre uma instância sumir e este roteador parar de mandar tráfego a ela.
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui
    csrf:
      enabled: true
    urls:
      - name: user-service
        url: /v3/api-docs/user
    # SEM bloco `oauth:` — DELIBERADO (ADR-020). O springdoc materializa essas propriedades como
    # um ui.initOAuth({...}) LITERAL dentro de /swagger-ui/swagger-initializer.js, servido ao
    # browser: `oauth.client-secret` publicava o segredo do cliente confidencial do BFF em texto
    # plano para qualquer visitante. E era supérfluo desde sempre — sob o BFF a página do Swagger
    # já exige sessão (SecurityConfig) e o "Try it out" dispara XHR same-origin com o cookie
    # SESSION, que a rota user-service converte em Bearer via tokenRelay(). O botão Authorize é
    # redundante. Não reintroduzir: `gateway-client` usa client_secret_basic/post, então nem a
    # variante "client-id + PKCE, sem secret" funciona (o token endpoint responde invalid_client).
    # `oauth2-redirect-url` saiu junto — só servia ao callback desse botão.

management:
  # Actuator numa porta de management interna (não publicada no host): o ponto de
  # entrada externo (8081) deixa de servir /actuator/**, fechando o acesso anônimo a
  # /prometheus e /metrics na borda. O Prometheus continua raspando por esta porta na
  # rede interna (ver infra/prometheus.yml → gateway:8181).
  server:
    port: 8181
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      # Default dev 100%; override em prod via MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true

  endpoint:
    gateway:
      enabled: true
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
