server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: user-service
  threads:
    virtual:
      # Servlet (Tomcat), thread-per-request: o RevocationTokenValidator (ADR-017) faz um GET
      # BLOQUEANTE no Redis a cada requisição, dentro da cadeia de validação do JWT. Em thread
      # de plataforma isso prende uma thread do pool durante o I/O; em virtual thread não.
      # NÃO replicar no gateway (WebFlux/reativo — a propriedade não tem efeito lá) nem no
      # authorization-server (usa JDBC/HikariCP, que é `synchronized` no caminho quente, e o
      # Java 21 ainda prende a carrier thread nesses blocos — JEP 491 só no 24).
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8082}
  data:
    mongodb:
      auto-index-creation: true
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:user-db}
      # Teto de conexões POR INSTÂNCIA (ADR-024) — lido pelo MongoConfig, que o aplica sobre a
      # ConnectionString. Fica aqui, e não dentro da MONGODB_URI, porque a URI é Docker secret
      # gerado pelo gen-secrets.sh: mudar o pool não pode exigir regerar segredo.
      max-pool-size: ${MONGO_MAX_POOL_SIZE:50}
    redis:
      # Autenticação nos data nodes (spring.data.redis.password) e nos sentinels
      # (spring.data.redis.sentinel.password) — propriedades distintas no Spring Boot 4.0.
      password: ${REDIS_PASSWORD}
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
        password: ${REDIS_PASSWORD}
  # Spring Cloud CircuitBreaker + Feign (group por nome do client, group.enabled=true): a
  # resolução é registry.getConfiguration(id) → getConfiguration(group) → default, e só
  # enxerga `configs.*` (mesmo racional do authorization-server). O nome `notification-service`
  # casa com o group name do @FeignClient (ADR-015).
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true

internal:
  api:
    token: ${INTERNAL_API_TOKEN}

# Revogação ativa de token (ADR-017): epoch por usuário no Redis. O user-service grava em
# revogação de role / desativação / hard-delete; o resource server rejeita o token cujo iat
# precede o epoch. TTL ≥ vida máxima do refresh token (a marca se auto-limpa depois).
security:
  revocation:
    enabled: ${TOKEN_REVOCATION_ENABLED:true}
    key-prefix: ${TOKEN_REVOCATION_KEY_PREFIX:revoke:user:}
    ttl: ${TOKEN_REVOCATION_TTL:75m}

# Consentimento LGPD: versão dos termos/privacidade registrada no cadastro (aceite versionado).
# Bump quando a política mudar (permite exigir re-consentimento). Override em prod via TERMS_VERSION.
app:
  terms:
    version: ${TERMS_VERSION:v1}
  # Retenção da trilha de auditoria LGPD (ADR-022). Gravada por documento em auditLogs.purgeAt,
  # com índice TTL expire-at — mudar este valor passa a valer para as entradas novas, sem
  # collMod no índice. Entradas anteriores à mudança não têm purgeAt e nunca expiram.
  audit:
    retention: ${AUDIT_LOG_RETENTION:180d}
  # Verificação de e-mail no cadastro (ADR-015).
  verification:
    # TTL do token opaco de verificação.
    token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:15m}
    # Base pública usada para montar o link de confirmação enviado por e-mail — aponta para
    # o gateway (borda), não para o user-service interno.
    base-url: ${API_BASE_URL:http://localhost:8081}
    # Limite de reenvio por conta-alvo (Redis), complementar ao rate limit por IP do gateway.
    resend-max-per-window: ${EMAIL_VERIFICATION_RESEND_MAX:3}
    resend-window: ${EMAIL_VERIFICATION_RESEND_WINDOW:1h}
    # Retenção do registro de outbox após a expiração/confirmação do token (TTL index do
    # Mongo em purgeAt, não em expiresAt — preserva histórico de auditoria do outbox).
    outbox-retention: ${EMAIL_VERIFICATION_OUTBOX_RETENTION:30d}
    # Varredura de retry do outbox (OutboxRetryService, emenda do ADR-015). Reprocessa o que o
    # disparo por evento deixou FAILED/PENDING, emitindo um token NOVO — o token em claro não é
    # persistido, então não há como reenviar o e-mail original.
    retry-interval: ${EMAIL_VERIFICATION_RETRY_INTERVAL:5m}
    # Idade mínima do registro antes de ser reprocessado. Vale também para o PENDING, que dentro
    # desta janela ainda pode estar em voo no executor assíncrono.
    retry-backoff: ${EMAIL_VERIFICATION_RETRY_BACKOFF:15m}
    # Teto de registros por titular. Contado sobre a coleção (não sobre o campo `attempts`):
    # cada retry cria um registro NOVO com attempts=0, então um contador por registro nunca
    # expiraria e a varredura reemitiria para sempre. Reenvios manuais consomem o mesmo teto.
    retry-max-attempts: ${EMAIL_VERIFICATION_RETRY_MAX_ATTEMPTS:5}

resilience4j:
  circuitbreaker:
    configs:
      notification-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  timelimiter:
    configs:
      notification-service:
        # 10s (não 3s): contra SMTP real (ex. Gmail) o handshake/TLS/auth costuma passar de
        # 3s — o NotificationController do notification-service bloqueia até o
        # JavaMailSender.send() retornar, então o timeout do Feign precisa cobrir essa latência
        # real, não só a de um Mailhog/Mailpit local.
        timeoutDuration: 10s

eureka:
  # Timings de convergência. Nos defaults (renew 30s / expiration 90s / fetch 30s) leva ~90s
  # entre uma instância morrer e o roteamento parar de mandar tráfego para ela — em dev isso é
  # o tempo morto após cada `docker compose restart`; sob autoscaling seria tráfego roteado
  # para instância inexistente. Reduzido para ~15-20s. O custo é mais heartbeat na rede,
  # irrelevante nesta escala. ATENÇÃO: o Eureka é só DUAS das três camadas de atraso — a
  # terceira é o cache do Spring Cloud LoadBalancer (ver gateway.yml/authorization-server.yml).
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}
    registry-fetch-interval-seconds: 10
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

springdoc:
  swagger-ui:
    enabled: false

management:
  # Actuator numa porta de management interna (não publicada no host): a porta de
  # tráfego (8090) deixa de servir /actuator/**, fechando o acesso anônimo a
  # /prometheus e /metrics (gap G14). O Prometheus continua raspando por esta porta
  # na rede interna (ver infra/prometheus.yml → user-service:8181).
  server:
    port: 8181
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      # Default dev 100%; override em prod via MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
