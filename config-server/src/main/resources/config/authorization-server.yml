server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: authorization-server

auth:
  issuer: ${AUTH_ISSUER:http://localhost:8082}

oauth:
  client:
    secret: ${OAUTH_CLIENT_SECRET}

internal:
  api:
    token: ${INTERNAL_API_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.oauth2: INFO
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

management:
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
