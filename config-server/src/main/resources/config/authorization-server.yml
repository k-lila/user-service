server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: authorization-server

  security:
    user:
      name: user
      password: password

    oauth2:
      authorizationserver:
        client:
          gateway-client:
            registration:
              client-id: "gateway-client"
              client-secret: "{noop}gateway-secret"
              client-authentication-methods:
                - "client_secret_basic"

              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"

              redirect-uris:
                - "http://localhost:8081/login/oauth2/code/gateway"

              scopes:
                - "openid"
                - "profile"

            require-authorization-consent: false

          swagger-client:
            registration:
              client-id: "swagger-client"
              client-secret: "{noop}swagger-secret"

              client-authentication-methods:
                - "client_secret_basic"

              authorization-grant-types:
                - "client_credentials"

              scopes:
                - "internal"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}

logging:
  level:
    org.springframework.security: TRACE

springdoc:
  swagger-ui:
    enabled: false

management:
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,metrics
