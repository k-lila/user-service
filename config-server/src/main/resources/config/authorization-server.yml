server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: authorization-server
  # Estado OAuth (registered client, authorizations, consents) em Postgres — escala horizontal
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${AUTH_DB_USER}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations:
        - classpath:schema/oauth2-registered-client-schema.sql
        - classpath:schema/oauth2-authorization-schema.sql
        - classpath:schema/oauth2-authorization-consent-schema.sql
  # Sessão HTTP (login/consent) compartilhada via Redis — escala horizontal
  data:
    redis:
      # Autenticação nos data nodes (spring.data.redis.password) e nos sentinels
      # (spring.data.redis.sentinel.password) — propriedades distintas no Spring Boot 4.0.
      password: ${REDIS_PASSWORD}
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:mymaster}
        nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}
        password: ${REDIS_PASSWORD}
  session:
    store-type: redis
    # TTL de sessão explícito (default implícito do Spring Session é 30m de inatividade).
    # Mantém 30m, mas torna a decisão visível e sobrescrevível por ambiente.
    timeout: ${SESSION_TIMEOUT:30m}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true

auth:
  issuer: ${AUTH_ISSUER:http://localhost:8082}

# Par de chaves de assinatura JWT (kid fixo, compartilhado entre instâncias).
# Defaults de classpath são chaves DE DESENVOLVIMENTO — gap de segurança conhecido;
# em produção sobrescrever JWK_PRIVATE_KEY/JWK_PUBLIC_KEY com secrets montados (file:...).
jwk:
  key-id: ${JWK_KEY_ID:user-service-key}
  private-key: ${JWK_PRIVATE_KEY:classpath:keys/app.key}
  public-key: ${JWK_PUBLIC_KEY:classpath:keys/app.pub}

oauth:
  client:
    secret: ${OAUTH_CLIENT_SECRET}

internal:
  api:
    token: ${INTERNAL_API_TOKEN}

# Lockout anti-brute-force no login (por par conta+IP, estado no Redis).
security:
  lockout:
    max-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
    duration: ${LOCKOUT_DURATION:15m}

# CORS (C12): necessário para o Swagger-UI trocar o code pelo token via fetch cross-origin.
# Origem do Swagger/borda (distinta da origem do SPA no gateway). Default dev http://localhost:8081.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS_AUTH:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.oauth2: INFO
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]"

# Com Spring Cloud CircuitBreaker + Feign (group por nome do client, group.enabled=true),
# a resolução é registry.getConfiguration(id) → getConfiguration(group) → default, e
# getConfiguration() só enxerga `configs.*`. Usar `instances.*` apenas pré-cria um circuit
# breaker avulso que o Feign não usa (o id real é derivado do método). O nome `user-service`
# casa com o group name do @FeignClient. minimumNumberOfCalls=10 (= janela) é necessário:
# o default é 100 e, com janela COUNT_BASED de 10, o circuito nunca abriria (C20).
resilience4j:
  circuitbreaker:
    configs:
      user-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  timelimiter:
    configs:
      user-service:
        timeoutDuration: 3s

management:
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      # Default dev 100%; override em prod via MANAGEMENT_TRACING_SAMPLING_PROBABILITY.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
