server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: authorization-server

  security:
    user:
      name: user
      password: password

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:9091/eureka}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.oauth2: INFO

springdoc:
  swagger-ui:
    enabled: false

management:
  tracing:
    enabled: true
    propagation:
      produce: b3
      consume: b3
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true

  endpoints:
    web:
      exposure:
        include: health,info,metrics
