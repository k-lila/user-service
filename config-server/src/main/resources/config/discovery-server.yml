server:
  port: ${SERVER_PORT:9091}
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: discovery-server
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 30
        initial-interval: 1000
        multiplier: 1.5
        max-interval: 5000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_PEER_URL:http://localhost:9091/eureka}
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  server:
    wait-time-in-ms-when-sync-empty: 3000
    # Lado servidor da convergência (o lado cliente vive nos *.yml dos apps). De nada adianta o
    # lease expirar em 30s se o registro só é varrido a cada 60s (eviction) e a resposta servida
    # aos clientes fica 30s em cache. Os três knobs têm de descer juntos.
    eviction-interval-timer-in-ms: 15000
    response-cache-update-interval-ms: 5000
    # enable-self-preservation permanece no default (true) DE PROPÓSITO: desligá-lo aceleraria
    # mais a evicção, mas remove a proteção contra evicção falsa em partição de rede — trocar
    # robustez por segundos não compensa num blueprint. Revisitar só se a evicção se mostrar
    # lenta em teste com instâncias reais caindo.

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
