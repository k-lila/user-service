# Config de TESTE: faz sombra ao application.yml de produção (test-classes vem antes no
# classpath), eliminando o import do config-server. Reúne as propriedades que em runtime
# chegam via config-server (authorization-server.yml). As coordenadas dinâmicas
# (Postgres/Redis dos Testcontainers e URL do WireMock) são injetadas por
# AbstractAuthIntegrationTest via @DynamicPropertySource.
spring:
  application:
    name: authorization-server
  cloud:
    config:
      enabled: false
    # Circuit breaker no Feign (C7): em runtime vem do config-server; este yml faz sombra,
    # então precisa reabilitar aqui para os testes de integração exercitarem o fallback.
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
  # Schemas SAS adaptados (mesmo bootstrap de produção) aplicados no Postgres do Testcontainers
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations:
        - classpath:schema/oauth2-registered-client-schema.sql
        - classpath:schema/oauth2-authorization-schema.sql
        - classpath:schema/oauth2-authorization-consent-schema.sql

auth:
  issuer: http://localhost:8082

# Chaves de DESENVOLVIMENTO do classpath (mesmas do default de produção dev)
jwk:
  key-id: user-service-key
  private-key: classpath:keys/app.key
  public-key: classpath:keys/app.pub

oauth:
  client:
    secret: test-client-secret
  # Mesmos defaults de produção (authorization-server.yml) — explicitados aqui porque este
  # yml de teste faz sombra ao config-server (sem import). RegisteredClientSeedIntegrationTest
  # valida que o seed preserva exatamente estes valores.
  gateway-client:
    redirect-uris: http://localhost:8081/login/oauth2/code/gateway-client,http://localhost:5173/login/oauth2/code/gateway-client,http://localhost:8081/swagger-ui/oauth2-redirect.html,https://oauth.pstmn.io/v1/callback
    post-logout-uris: http://localhost:5173/

internal:
  api:
    token: test-internal-token

security:
  lockout:
    max-attempts: 5
    duration: 15m

# Resilience4j em modo de TESTE: janela mínima abre o circuito com 2 falhas consecutivas;
# waitDurationInOpenState longo mantém o circuito aberto durante o teste (o reset entre
# testes é feito pela classe base via CircuitBreakerRegistry); timeout de 2s encurta o
# teste de timeout do TimeLimiter.
#
# NOTA: usa `configs.user-service` (configuração NOMEADA) — igual ao yml de produção, e NÃO
# `instances.user-service`. Com Spring Cloud CircuitBreaker + Feign (group por nome do client),
# a resolução é registry.getConfiguration(id) → getConfiguration(group) → default — e
# getConfiguration() só enxerga o que vem de `configs.*`; `instances.*` apenas pré-cria um
# circuit breaker avulso chamado "user-service" que o Feign não usa (o id real é derivado
# do método, ex.: IUserClientgetUserByEmailString). Verificado empiricamente no C10.2.
resilience4j:
  circuitbreaker:
    configs:
      user-service:
        slidingWindowSize: 2
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 1
        # Espelha a produção (ADR-021): 404 é resultado de negócio e não conta para o circuito.
        # Necessário aqui para o IT poder asserir que 6 logins com 404 NÃO abrem o circuito —
        # com janela 2 e threshold 50%, sem esta linha o circuito abriria já na 2ª tentativa.
        ignoreExceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      user-service:
        timeoutDuration: 2s

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0.0
