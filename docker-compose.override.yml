# docker-compose.override.yml — deltas APENAS de desenvolvimento.
#
# Auto-carregado por `docker compose up` (base + override). Republica no host as portas
# dos serviços internos que o base (prod-safe) deixou só na rede interna, para facilitar
# debug local. Cada serviço continua definido uma única vez no docker-compose.yml.
#
#   Dev:  docker compose up -d --build                 (base + este override)
#   Prod: docker compose -f docker-compose.yml up -d    (ignora este override)

services:

  config-lb:
    ports:
      - "8888:8888"

  discovery-server-1:
    ports:
      - "9091:9091"

  discovery-server-2:
    ports:
      - "9092:9092"

  user-service:
    ports:
      - "8090:8090"

  notification-service:
    ports:
      - "8095:8095"

  # Front-channel OAuth2 direto em dev (browser → localhost:8082). Em prod, exposto
  # pelo ingress/TLS restrito a /oauth2/authorize, /login e /connect/logout.
  authorization-server:
    ports:
      - "8082:8082"

  # Observabilidade: publicada SÓ NO LOOPBACK, também em dev.
  #
  # Sem o `127.0.0.1:` explícito, o Docker publica em 0.0.0.0 — era o estado anterior, e
  # significava que qualquer dispositivo da rede local alcançava Grafana, Prometheus e Zipkin.
  # Nenhum dos três tem lockout, rate limit ou MFA (Grafana só tem usuário/senha; Prometheus e
  # Zipkin não têm autenticação nenhuma), e os dois últimos expõem métricas e traces com URLs,
  # hostnames internos e topologia do sistema. Presos ao loopback, respondem a `localhost` na
  # própria máquina e recusam conexão de qualquer outro host.
  #
  # ASSIMETRIA DELIBERADA: só a observabilidade vai para loopback. gateway, interface,
  # authorization-server, user-service, notification-service, config-lb e os discovery-servers
  # continuam em 0.0.0.0 porque são exatamente as portas que um teste manual a partir de outro
  # dispositivo (celular no SPA, cliente HTTP externo) pode legitimamente querer alcançar em dev.
  zipkin:
    ports:
      - "127.0.0.1:9411:9411"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:3000:3000"

  # gateway e interface: portas movidas da base para cá (G10 / ADR-019).
  # Na base prod-safe nenhuma das duas é publicada no host — só o cloudflared
  # alcança a rede interna. Listas de ports: são concatenadas no merge, então
  # a remoção da base (e não só a adição aqui) é obrigatória para não duplicar.

  gateway:
    ports:
      - "8081:8081"

  interface:
    # WEB_HOST_PORT: porta do host da borda pública (mapeia para :80 do container).
    # Dev usa o default 5173; sob Cloudflare Tunnel a porta do host é irrelevante
    # (o cloudflared alcança interface:80 pela rede interna Docker).
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
