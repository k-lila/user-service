# Reverse-proxy de borda — terminação TLS em dev (certs do mkcert).
# Único ponto HTTPS do sistema; o tráfego interno segue HTTP na rede do compose.
#   app.localhost  -> interface:80            (SPA + proxy BFF -> gateway:8081)
#   auth.localhost -> authorization-server:8082 (front-channel OAuth2)
# Um cert único (edge.crt/edge.key) cobre os dois hosts via SANs.

# Todo HTTP -> HTTPS.
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

# app.localhost — SPA e rotas BFF (atrás do nginx do login-interface).
server {
  listen 443 ssl;
  server_name app.localhost;

  ssl_certificate     /etc/nginx/certs/edge.crt;
  ssl_certificate_key /etc/nginx/certs/edge.key;

  # DNS do Docker Compose: resolução lazy do upstream em runtime (evita falha de
  # subida do nginx se o serviço ainda não estiver no ar).
  resolver 127.0.0.11 valid=10s;

  location / {
    set $upstream http://interface:80;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }
}

# auth.localhost — front-channel do authorization-server (/oauth2/authorize, /login, /connect/logout).
server {
  listen 443 ssl;
  server_name auth.localhost;

  ssl_certificate     /etc/nginx/certs/edge.crt;
  ssl_certificate_key /etc/nginx/certs/edge.key;

  resolver 127.0.0.11 valid=10s;

  location / {
    set $upstream http://authorization-server:8082;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
  }
}
