# LB do config-server. Resolução DINÂMICA por DNS (ADR-024), e não mais um bloco `upstream`
# com os nomes config-server-1/config-server-2 fixos.
#
# POR QUE MUDOU. O `upstream` estático tem uma propriedade fatal para elasticidade: o nginx
# resolve os nomes UMA VEZ, no start, e RECUSA INICIAR se algum não resolver ("host not found in
# upstream"). Com os dois nomes hardcoded, subir uma única instância de config-server derrubava o
# config-lb — ou seja, o piso mínimo era impossível. E crescer além de 2 exigia editar este
# arquivo, o oposto de `--scale`.
#
# COMO FUNCIONA. `resolver` + `proxy_pass` sobre VARIÁVEL adia a resolução para o runtime e a
# revalida a cada 10s. É exatamente o padrão já usado (e comentado) em login-interface/nginx.conf.
# O DNS embutido do Docker devolve TODOS os IPs das réplicas do serviço `config-server`, então
# `--scale config-server=N` entra em rotação em ≤10s, sem reload e sem editar este arquivo.
#
# ARMADILHA: sem a variável (`proxy_pass http://config-server:8888;` direto) o nginx volta a
# resolver no start e o `resolver` acima vira decorativo. A variável é obrigatória.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8888;

    location / {
        set $config_server http://config-server:8888;
        proxy_pass $config_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Preserva o failover que o bloco `upstream` dava de graça: quando o nome resolve para
        # várias réplicas, o nginx as trata como grupo round-robin e tenta a seguinte em erro.
        # É o que justifica manter o config-lb em vez de apontar os clientes direto ao DNS do
        # serviço — o cliente Spring sobe com fail-fast e uma réplica morta sorteada o derrubaria.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
