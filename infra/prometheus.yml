global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "microservices"
    metrics_path: "/actuator/prometheus"

    # Porta 8181 = porta de management (management.server.port), não a porta de
    # tráfego do serviço. O actuator saiu da porta pública nos quatro (gap G14);
    # esta porta não é publicada no host, só alcançável pela rede Docker interna.
    #
    # DESCOBERTA POR DNS (ADR-024) para os quatro apps de domínio, que são o eixo replicável.
    # Com `static_configs`, o nome `user-service:8181` resolve para UMA réplica por scrape
    # (round-robin do DNS do Docker): a partir de N > 1 as séries passam a alternar entre
    # processos diferentes a cada 5s, e a métrica deixa de significar qualquer coisa — heap de
    # containers distintos somado como se fosse o mesmo. O tipo A devolve um target por réplica.
    dns_sd_configs:
      - names:
          - authorization-server
          - user-service
          - notification-service
          - gateway
        type: A
        port: 8181
        refresh_interval: 15s

    # Os discovery-servers seguem estáticos DE PROPÓSITO: são réplicas NOMEADAS (peers Eureka com
    # identidade e EUREKA_PEER_URL recíprocos), não pertencem ao eixo replicável e servem o
    # actuator na porta principal, não na 8181. discovery-server-2 só existe com --profile ha;
    # o Prometheus marca o target como down no piso mínimo, o que é o estado correto a reportar.
    static_configs:
      - targets:
          - discovery-server-1:9091
          - discovery-server-2:9092

    relabel_configs:
      # O dns_sd resolve para IP, então `instance` vira 172.x.y.z:8181 — distingue réplicas (que
      # é o objetivo), mas não diz QUEM é. Este label preserva o nome lógico consultado.
      # Vazio nos alvos de static_configs (discovery), que não passam por descoberta DNS.
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: "mongodb"
    static_configs:
      - targets:
          - mongodb-exporter:9216

  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: "redis"
    metrics_path: /scrape
    static_configs:
      - targets:
          - redis://redis-1:6379
          - redis://redis-2:6379
          - redis://redis-3:6379
          - redis://redis-sentinel-1:26379
          - redis://redis-sentinel-2:26379
          - redis://redis-sentinel-3:26379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121

  - job_name: "config-server"
    metrics_path: "/actuator/prometheus"
    # /actuator/prometheus do config-server fica atrás de HTTP Basic (SecurityConfig:
    # anyRequest().authenticated()), então o scrape precisa autenticar. A senha vem do
    # Docker secret montado em /run/secrets/CONFIG_SERVER_PASSWORD (0.3) — sem senha literal
    # no arquivo. O usuário (não-segredo) segue default dev; alinhe ao CONFIG_SERVER_USERNAME.
    basic_auth:
      username: config-client
      password_file: /run/secrets/CONFIG_SERVER_PASSWORD
    # Descoberta por DNS (ADR-024): config-server virou serviço único escalável, então o alvo
    # não é mais um par de nomes fixos. O DNS do Docker devolve um registro A por réplica, e
    # `--scale config-server=N` passa a render N targets sem editar este arquivo.
    dns_sd_configs:
      - names: ["config-server"]
        type: A
        port: 8888
        refresh_interval: 15s
    # Mesmo label do job `microservices`: sem ele o alvo aparece só como IP, que muda a cada
    # recreate do container e não diz de quem é.
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
