global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "microservices"
    metrics_path: "/actuator/prometheus"

    # Porta 8181 = porta de management (management.server.port), não a porta de
    # tráfego do serviço. O actuator saiu da porta pública nos quatro (gap G14);
    # esta porta não é publicada no host, só alcançável pela rede Docker interna.
    # Os discovery-servers ainda servem o actuator na porta principal.
    static_configs:
      - targets:
          - discovery-server-1:9091
          - discovery-server-2:9092
          - authorization-server:8181
          - user-service:8181
          - notification-service:8181
          - gateway:8181

  - job_name: "mongodb"
    static_configs:
      - targets:
          - mongodb-exporter:9216

  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: "redis"
    metrics_path: /scrape
    static_configs:
      - targets:
          - redis://redis-1:6379
          - redis://redis-2:6379
          - redis://redis-3:6379
          - redis://redis-sentinel-1:26379
          - redis://redis-sentinel-2:26379
          - redis://redis-sentinel-3:26379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121

  - job_name: "config-server"
    metrics_path: "/actuator/prometheus"
    # /actuator/prometheus do config-server fica atrás de HTTP Basic (SecurityConfig:
    # anyRequest().authenticated()), então o scrape precisa autenticar. A senha vem do
    # Docker secret montado em /run/secrets/CONFIG_SERVER_PASSWORD (0.3) — sem senha literal
    # no arquivo. O usuário (não-segredo) segue default dev; alinhe ao CONFIG_SERVER_USERNAME.
    basic_auth:
      username: config-client
      password_file: /run/secrets/CONFIG_SERVER_PASSWORD
    static_configs:
      - targets:
          - config-server-1:8888
          - config-server-2:8888
