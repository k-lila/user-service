# X-Forwarded-Proto pass-through: quando há uma borda TLS na frente (Cloudflare Tunnel),
# preserva o "https" que ela já fixou; sem borda (HTTP puro), o header chega vazio
# e cai no $scheme local (http) — comportamento atual preservado.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;

  # ── Headers de segurança (G3) ────────────────────────────────────────────────
  # `always` para valerem também em respostas de erro (4xx/5xx), não só nas 2xx/3xx.
  #
  # ARMADILHA DO NGINX: add_header NÃO é herdado por um bloco interno que tenha qualquer
  # add_header próprio — o bloco interno perde TODOS os do nível de cima. Se algum location
  # precisar de um header diferente, ele tem de repetir a lista inteira (ver /swagger-ui).
  #
  # HSTS: quem termina TLS é a Cloudflare, então o Spring nunca emite este header (a request
  # que chega ao gateway é HTTP). Emitir aqui é o que efetivamente o entrega ao browser.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # CSP: 'unsafe-inline' em style-src é DELIBERADO — o Tailwind injeta estilo inline e a
  # alternativa (nonce/hash por build) não compensa aqui. Dívida consciente em docs/SECURITY.md.
  # frame-ancestors 'none' cobre clickjacking (equivalente moderno do X-Frame-Options: DENY).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # DNS do Docker Compose (resolução lazy do host "gateway" em runtime,
  # evita falha de subida do nginx se o gateway ainda não estiver no ar).
  resolver 127.0.0.11 valid=10s;

  # BFF: encaminha os caminhos do gateway pela mesma origem do SPA (:5173 no host em dev,
  # ${PUBLIC_ORIGIN} atrás do Cloudflare Tunnel em deploy).
  # /login (e todos os subpaths: /login?error, /login/oauth2/**) vai ao gateway → auth-server.
  # /default-ui.css é o CSS do formulário do IdP (match exato, ADR-019).
  # O SPA mora em / (router.tsx), sem rota /login própria.
  #
  # X-Forwarded-For é suprimido em TODOS os blocos (Elo 6, ADR-019): o nginx não envia
  # X-Forwarded-For ao gateway. Isso evita que o ForwardedHeaderTransformer (strategy=framework)
  # reescreva remoteAddress para o IP público, o que faria trusted-proxies falhar e
  # XForwardedHeadersFilter não emitir X-Forwarded-Host/Proto ao auth-server.
  # CF-Connecting-IP NÃO é removido — é header customizado, não XFF, e chega intacto ao
  # gateway preservando a fonte confiável de IP do ADR-010 (rate limit e lockout).
  location /v1/users {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # Rotas administrativas (ADR-014). ROLE_ADMIN continua sendo checado exclusivamente downstream,
  # no AdminController via @PreAuthorize — o nginx só encaminha.
  location /v1/admin {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location /oauth2 {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # /login cobre: formulário do IdP (/login), erro de credencial (/login?error) e callback
  # OAuth2 (/login/oauth2/code/gateway-client). Prefixo mais longo que /oauth2 (separado),
  # mais curto que /login/oauth2 (removido — semanticamente inconsistente com esta mudança;
  # o nginx longest-prefix faria o callback funcionar, mas o comentário ficaria enganoso).
  # Substituição por /login é segura: tudo sob /login vai ao mesmo destino (gateway → auth-server).
  location /login {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # CSS do formulário de login do IdP (ADR-019). Match exato (=) garante que só /default-ui.css
  # exato é capturado aqui — nenhum outro path é afetado. SEM add_header próprio: herda os
  # headers de segurança do nível server (HSTS, CSP, X-Content-Type-Options). Adicionar
  # add_header aqui descartaria TODOS os do nível server (armadilha nginx, nginx.conf:15-17).
  location = /default-ui.css {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location /logout {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # Front-channel do RP-Initiated Logout (ADR-018): após o POST /logout encerrar a sessão do
  # gateway, o browser é redirecionado para ${PUBLIC_ORIGIN}/connect/logout, que o gateway
  # encaminha ao end_session_endpoint do authorization-server. Sob hostname único o auth-server
  # não é alcançável de fora — este proxy é o que torna o logout completo possível.
  location /connect/ {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  # Swagger-UI e o doc OpenAPI agregado. Sob hostname único o gateway não é alcançável
  # diretamente, então sem estes dois blocos /swagger-ui cairia no try_files do SPA.
  # PROTEÇÃO: a sessão OAuth2 do gateway (ADR-020). Os dois paths saíram do permitAll() do
  # SecurityConfig — anônimo em /swagger-ui leva 302 para o oauth2Login; em /v3/api-docs, 401.
  # Este proxy NÃO é o controle de acesso: ele só entrega ao gateway, que decide. O Cloudflare
  # Access, controle previsto originalmente, exige cartão de crédito no Zero Trust e foi
  # descartado — não reintroduzir a afirmação de que ele protege estas rotas.
  #
  # CSP própria: o Swagger-UI usa estilo e script inline e quebra sob a CSP do SPA. Como o
  # nginx descarta os add_header do nível de cima quando o location tem os seus, a lista
  # inteira é repetida aqui, relaxando SÓ script-src/style-src.
  location /swagger-ui {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location /v3/api-docs {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    # XFF suprimido (Elo 6, ADR-019): sem supressão, ForwardedHeaderTransformer (strategy=framework)
    # reescreve remoteAddress para o IP público do cliente, trusted-proxies falha e
    # XForwardedHeadersFilter não emite X-Forwarded-Host/Proto ao auth-server. CF-Connecting-IP
    # é a fonte de IP do ADR-010 e chega intacto por ser header customizado, não hop-by-hop.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $fwd_proto;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
