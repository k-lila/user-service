server {
  listen 80;

  # DNS do Docker Compose (resolução lazy do host "gateway" em runtime,
  # evita falha de subida do nginx se o gateway ainda não estiver no ar).
  resolver 127.0.0.11 valid=10s;

  # BFF: encaminha os caminhos do gateway pela mesma origem do SPA (:5173 no host).
  # Só o callback OAuth2 (/login/oauth2) vai ao gateway; /login puro é rota do SPA.
  location /users {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /oauth2 {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /login/oauth2 {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /logout {
    set $gateway http://gateway:8081;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}
