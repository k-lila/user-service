version: "3.9"

networks:
  user-service-net:
    driver: bridge

volumes:
  user_db_data:
  auth_db_data:

services:
  zipkin:
    image: openzipkin/zipkin:latest
    networks:
      - user-service-net
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9411/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  config-server:
    build: ./config-server
    networks:
      - user-service-net
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  discovery-server:
    build: ./discovery-server
    networks:
      - user-service-net
    ports:
      - "9091:9091"
    depends_on:
      config-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    environment:
      SERVER_PORT: 9091
      CONFIG_SERVER_URL: http://config-server:8888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  authorization-server:
    build: ./authorization-server
    networks:
      - user-service-net
    ports:
      - "8082:8082"
    depends_on:
      discovery-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:9091/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OAUTH_GATEWAY_CLIENT: http://localhost:8081/login/oauth2/code/gateway-client
      OAUTH_SWAGGER_REDIRECT_URL: http://localhost:8081/swagger-ui/oauth2-redirect.html
      AUTH_ISSUER: http://authorization-server:8082
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-gateway-secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token}
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/authdb
      AUTH_DB_USER: auth_service
      AUTH_DB_PASSWORD: auth_1234321
      REDIS_HOST: user-redis
      REDIS_PORT: 6379

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  user-service:
    build: ./user-service
    networks:
      - user-service-net
    ports:
      - "8090:8090"
    depends_on:
      discovery-server:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      user-mongo:
        condition: service_started
    environment:
      SERVER_PORT: 8090
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:9091/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MONGODB_URI: mongodb://user_service:user_1234321@user-mongo:27017/user-db?authSource=admin
      MONGODB_DATABASE: user-db
      AUTH_ISSUER_URI: http://authorization-server:8082
      AUTH_URL: http://localhost:8082/oauth2/authorize
      AUTH_TOKEN: http://localhost:8082/oauth2/token
      API_BASE_URL: http://localhost:8081
      REDIS_HOST: user-redis
      REDIS_PORT: 6379
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-internal-dev-token}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  gateway:
    build: ./gateway
    networks:
      - user-service-net
    ports:
      - "8081:8081"
    depends_on:
      discovery-server:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URI: http://discovery-server:9091/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_ISSUER_URI: http://authorization-server:8082
      OAUTH_AUTHORIZATION_URI: http://localhost:8082/oauth2/authorize
      OAUTH2SWAGGER_REDIRECT_URL: http://localhost:8081/swagger-ui/oauth2-redirect.html
      OAUTH_CLIENT_ID: gateway-client
      OAUTH_CLIENT_SECRET: gateway-secret
      OAUTH_REDIRECT_URI: http://localhost:5173/login/oauth2/code/gateway-client
      AUTH_URL: http://localhost:8082/oauth2/authorize
      AUTH_TOKEN: http://localhost:8082/oauth2/token
      API_BASE_URL: http://localhost:8081
      REDIS_HOST: user-redis
      REDIS_PORT: 6379

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  interface:
    build:
      context: ./login-interface
      args:
        # BFF: vazio = chamadas relativas pelo proxy do nginx (mesma origem :5173).
        VITE_API_URL: ""
    ports:
      - "5173:80"
    networks:
      - user-service-net

  user-redis:
    image: redis:7
    networks:
      - user-service-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  auth-postgres:
    image: postgres:16
    networks:
      - user-service-net
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_1234321
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  user-mongo:
    image: mongo:8.2
    networks:
      - user-service-net
    volumes:
      - user_db_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user_service
      MONGO_INITDB_ROOT_PASSWORD: user_1234321

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - user-service-net
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
      - user-service
      - authorization-server
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - user-service-net
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
