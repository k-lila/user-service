version: "3.9"

networks:
  user-service-net:
    driver: bridge

volumes:
  mongo_1_data:
  mongo_2_data:
  mongo_3_data:
  auth_db_data:

services:

  # ──────────────────────────────────────────────
  # Observabilidade
  # ──────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin:latest
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — observabilidade só na rede interna (G2). Republicado em dev no override.
    environment:
      # Storage do Zipkin: in-memory por default (dev) — traces somem no restart. Em prod, setar
      # ZIPKIN_STORAGE_TYPE=elasticsearch + ZIPKIN_ES_HOSTS/USERNAME/PASSWORD apontando para um
      # Elasticsearch externo (persistência após restart). Ver docs/CONFIG.md § Observabilidade e
      # .env.example. As chaves do container são os nomes nativos do Zipkin.
      STORAGE_TYPE: ${ZIPKIN_STORAGE_TYPE:-mem}
      ES_HOSTS: ${ZIPKIN_ES_HOSTS:-}
      ES_USERNAME: ${ZIPKIN_ES_USERNAME:-}
      ES_PASSWORD: ${ZIPKIN_ES_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9411/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Config Server HA (2 instâncias + nginx LB)
  # ──────────────────────────────────────────────

  config-server-1:
    build: ./config-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    environment:
      SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  config-server-2:
    build: ./config-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    environment:
      SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  config-lb:
    image: nginx:alpine
    cpus: 0.25
    mem_limit: 64m
    networks:
      - user-service-net
    # Sem ports: em prod — config-server não publicado (G3). Republicado em dev no override.
    volumes:
      - ./infra/config-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      config-server-1:
        condition: service_healthy
      config-server-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Eureka HA (2 instâncias em peer replication)
  # ──────────────────────────────────────────────

  discovery-server-1:
    build: ./discovery-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — Eureka só na rede interna (G2). Republicado em dev no override.
    depends_on:
      config-lb:
        condition: service_healthy
    environment:
      SERVER_PORT: 9091
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      EUREKA_HOSTNAME: discovery-server-1
      EUREKA_PEER_URL: http://discovery-server-2:9092/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  discovery-server-2:
    build: ./discovery-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — Eureka só na rede interna (G2). Republicado em dev no override.
    depends_on:
      config-lb:
        condition: service_healthy
    environment:
      SERVER_PORT: 9092
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      EUREKA_HOSTNAME: discovery-server-2
      EUREKA_PEER_URL: http://discovery-server-1:9091/eureka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MongoDB Replica Set (3 nós + init)
  # ──────────────────────────────────────────────

  mongo-1:
    image: mongo:8.2
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    entrypoint:
      - bash
      - -c
      - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_1_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  mongo-2:
    image: mongo:8.2
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    entrypoint:
      - bash
      - -c
      - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  mongo-3:
    image: mongo:8.2
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    entrypoint:
      - bash
      - -c
      - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  mongo-init:
    image: mongo:8.2
    cpus: 0.5
    mem_limit: 256m
    networks:
      - user-service-net
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
    command: >
      mongosh --host mongo-1:27017
              -u ${MONGO_USER} -p ${MONGO_PASSWORD}
              --authenticationDatabase admin
              --eval "try {
                rs.initiate({
                  _id: 'rs0',
                  members: [
                    {_id: 0, host: 'mongo-1:27017'},
                    {_id: 1, host: 'mongo-2:27017'},
                    {_id: 2, host: 'mongo-3:27017'}
                  ]
                });
                print('Replica set iniciado');
              } catch(e) {
                if (e.codeName === 'AlreadyInitialized') print('Replica set ja iniciado');
                else throw e;
              }"
    restart: on-failure

  # ──────────────────────────────────────────────
  # Redis Sentinel (3 nós + 3 sentinels)
  # ──────────────────────────────────────────────

  redis-1:
    image: redis:7
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - user-service-net
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-2:
    image: redis:7
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - user-service-net
    command: redis-server --replicaof redis-1 6379
    depends_on:
      redis-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-3:
    image: redis:7
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - user-service-net
    command: redis-server --replicaof redis-1 6379
    depends_on:
      redis-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && exec redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL (estado OAuth — sem SPOF identificado)
  # ──────────────────────────────────────────────

  auth-postgres:
    image: postgres:16
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Serviços de aplicação
  # ──────────────────────────────────────────────

  authorization-server:
    build: ./authorization-server
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    # Sem ports: em prod. O front-channel (browser → /oauth2/authorize, /login, /connect/logout)
    # é exposto pelo reverse-proxy de TLS/ingress (G1) num hostname dedicado (ex.: auth.<dominio>),
    # restrito a esses paths — não pela publicação da porta inteira. Em dev, o override republica 8082.
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OAUTH_GATEWAY_CLIENT: ${OAUTH_GATEWAY_CLIENT:-http://localhost:8081/login/oauth2/code/gateway-client}
      OAUTH_SWAGGER_REDIRECT_URL: ${OAUTH_SWAGGER_REDIRECT_URL:-http://localhost:8081/swagger-ui/oauth2-redirect.html}
      CORS_ALLOWED_ORIGINS_AUTH: ${CORS_ALLOWED_ORIGINS_AUTH:-http://localhost:8081}
      AUTH_ISSUER: http://authorization-server:8082
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/authdb
      AUTH_DB_USER: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  user-service:
    build: ./user-service
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    # Sem ports: em prod — acesso só via gateway (G2: 8090 direto contorna rate limit/CORS).
    # Republicado em dev no override.
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-1:27017,mongo-2:27017,mongo-3:27017/user-db?replicaSet=rs0&authSource=admin
      MONGODB_DATABASE: user-db
      AUTH_ISSUER_URI: http://authorization-server:8082
      AUTH_URL: ${AUTH_URL:-http://localhost:8082/oauth2/authorize}
      AUTH_TOKEN: ${AUTH_TOKEN:-http://localhost:8082/oauth2/token}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  gateway:
    build: ./gateway
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    ports:
      - "8081:8081"
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD}
      EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_ISSUER_URI: http://authorization-server:8082
      OAUTH_AUTHORIZATION_URI: ${OAUTH_AUTHORIZATION_URI:-http://localhost:8082/oauth2/authorize}
      OAUTH2SWAGGER_REDIRECT_URL: ${OAUTH2SWAGGER_REDIRECT_URL:-http://localhost:8081/swagger-ui/oauth2-redirect.html}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OAUTH_CLIENT_ID: gateway-client
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/login/oauth2/code/gateway-client}
      AUTH_URL: ${AUTH_URL:-http://localhost:8082/oauth2/authorize}
      AUTH_TOKEN: ${AUTH_TOKEN:-http://localhost:8082/oauth2/token}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    healthcheck:
      # Actuator do gateway vive na porta de management interna (8181), não na 8081 pública.
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  interface:
    build:
      context: ./login-interface
      args:
        VITE_API_URL: ""
    cpus: 0.25
    mem_limit: 64m
    # Borda pública (SPA + proxy BFF). Porta do host por env (listas de ports: são concatenadas
    # entre base/override, então não dá para "remapear" via override): dev usa o default 5173
    # (URL documentada); prod seta WEB_HOST_PORT (ex.: 80, atrás do TLS/ingress — G1).
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    networks:
      - user-service-net

  # ──────────────────────────────────────────────
  # Observabilidade (métricas)
  # ──────────────────────────────────────────────

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — exporters só na rede interna. Republicado em dev no override se necessário.
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-1:27017/?replicaSet=rs0&authSource=admin
    command:
      - --collect-all
      - --discovering-mode
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — exporters só na rede interna.
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-postgres:5432/authdb?sslmode=disable
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — exporters só na rede interna.
    # Modo multi-target: REDIS_ADDR não definido; o alvo concreto vem do Prometheus via ?target=.
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — métricas só na rede interna (G2/G6). Republicado em dev no override.
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
      - user-service
      - authorization-server
      - mongodb-exporter
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — dashboards só na rede interna (G2/G11). Republicado em dev no override.
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    restart: unless-stopped
