# ──────────────────────────────────────────────
# Âncoras reutilizáveis (extension fields x-*, ignorados pelo Compose).
# Mescladas nos serviços via merge key (<<: *nome). NÃO cruzam para os overlays
# (override/deploy) — âncoras valem só dentro deste arquivo.
# ──────────────────────────────────────────────

# Timing comum de healthcheck (o `test:` continua por-serviço).
x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 25

# Perfis de recurso (cpus / mem_limit / mem_reservation). Racional em docs/CONFIG.md.
x-res-app: &res-app # nós Mongo (os apps Spring usam *res-jvm — ver abaixo)
  cpus: 1.0
  mem_limit: 1024m
  mem_reservation: 512m
# Perfil dos 4 apps Spring, SEPARADO do *res-app de propósito: com cpus 1.0 a JVM enxerga
# "Effective CPU Count = 1" e a ergonomia a classifica como *client-class machine*, escolhendo
# UseSerialGC (stop-the-world, thread única). O G1 forçado em JAVA_TOOL_OPTIONS (ver
# x-spring-app-env) só rende se houver core sobrando para a marcação concorrente — daí 2.0.
# Também alivia o throttling do CFS (1.0 = 25ms de CPU por período de 100ms), que era a outra
# metade das caudas de latência. Não fundir de volta com *res-app: os nós Mongo não precisam
# disso e o bump dobraria a quota deles sem motivo.
x-res-jvm: &res-jvm # apps Spring (auth-server / user-service / notification / gateway)
  # Parametrizado para o eixo replicável (ADR-024): estes números foram calibrados para UM
  # processo por serviço, e valem POR RÉPLICA. Num host de 12 vCPU / 15 GB, seis réplicas a
  # cpus 2.0 e mem_reservation 512m não cabem. Os defaults preservam exatamente o comportamento
  # anterior — o knob existe para quem escala, e baixar para ~1.5 mantém a JVM fora do
  # UseSerialGC (ver o racional acima, que continua valendo por réplica).
  cpus: ${APP_CPUS:-2.0}
  mem_limit: ${APP_MEM_LIMIT:-1024m}
  mem_reservation: ${APP_MEM_RESERVATION:-512m}
x-res-mid: &res-mid # config-server / discovery / postgres
  cpus: 0.75
  mem_limit: 512m
  mem_reservation: 256m
x-res-half: &res-half # zipkin / prometheus
  cpus: 0.5
  mem_limit: 512m
  mem_reservation: 256m
x-res-redis: &res-redis # nós de dados Redis
  cpus: 0.5
  mem_limit: 256m
  mem_reservation: 64m
x-res-small: &res-small # sentinels + exporters de métricas
  cpus: 0.25
  mem_limit: 128m
x-res-tiny: &res-tiny # config-lb + interface
  cpus: 0.25
  mem_limit: 64m

# Env compartilhada dos clientes do config-server (importam config remota + credencial).
x-spring-config: &spring-config
  CONFIG_SERVER_URL: http://config-lb:8888
  CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
  SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/,optional:configserver:http://config-lb:8888

# Env comum dos serviços de app registrados no Eureka (+ tracing Zipkin + sentinels Redis).
x-spring-app-env: &spring-app-env
  <<: *spring-config
  EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  REDIS_SENTINEL_MASTER: mymaster
  REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  # ADR-025. As três PRECISAM estar aqui, e não só no .env.example: sem repasse explícito a
  # propriedade nasce DOCUMENTADA E INERTE — foi o que aconteceu com
  # MANAGEMENT_TRACING_SAMPLING_PROBABILITY, que ficou no .env.example sem env_file e sem
  # environment:, e o deploy rodou a 100% de sampling independentemente do .env.
  # Os defaults repetem os dos YAMLs do config-server; ausência da variável no .env não impede o boot.
  SESSION_MAX_LIFETIME: ${SESSION_MAX_LIFETIME:-8h}
  SESSION_REVALIDATION_ENABLED: ${SESSION_REVALIDATION_ENABLED:-true}
  REVOCATION_JWK_SET_URI: ${REVOCATION_JWK_SET_URI:-http://authorization-server:8082/oauth2/jwks}
  # Coletor e heap EXPLÍCITOS: sem estes flags a JVM decide sozinha e decide mal em container
  # pequeno (SerialGC + heap de 25% = 256MiB). MaxRAMPercentage 60 e não 70: o overhead
  # non-heap medido (metaspace + code cache + stacks + buffers) é ~150MiB, e 70% de 1024MiB
  # deixaria o total a ~870MiB de um teto de 1024MiB — margem fina demais para OOM kill.
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:+UseG1GC -XX:MaxRAMPercentage=60}
  # Amostragem de tracing. O default 1.0 preserva o comportamento de dev; em deploy exporte
  # 0.1 no .env — a 100% o Zipkin (storage `mem`, 512MiB) satura antes da aplicação.
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
  # ── Knobs lidos por 2+ apps. Ficam aqui, e não por-serviço, justamente porque o valor tem de
  # ser o MESMO nos serviços que os leem — TOKEN_REVOCATION_KEY_PREFIX em especial: gateway,
  # auth-server e user-service compartilham a chave de revogação no Redis, e um prefixo divergente
  # faz a revogação silenciosamente não pegar (ADR-017).
  #
  # ATENÇÃO ao mexer aqui e nos blocos por-serviço abaixo: o default do compose ESPELHA o default
  # do YAML do config-server e os dois têm de continuar iguais. Nunca escreva `${VAR:-}` — o
  # default vazio injeta string vazia no container e SOBRESCREVE o default do YAML, em vez de
  # deixá-lo valer. Foi a ausência dessas linhas que manteve 19 variáveis documentadas no
  # docs/CONFIG.md inertes: sem `env_file` e fora de todo `environment:`, setá-las no .env não
  # chegava a container nenhum.
  TOKEN_REVOCATION_ENABLED: ${TOKEN_REVOCATION_ENABLED:-true}
  TOKEN_REVOCATION_KEY_PREFIX: "${TOKEN_REVOCATION_KEY_PREFIX:-revoke:user:}"
  SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
  # Fonte de IP do rate limiting e do lockout (ADR-010). Trocar em deploy não-Cloudflare.
  TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-CF-Connecting-IP}

# Template comum dos 3 nós Mongo: o entrypoint faz copy-to-/tmp do keyfile (o RS exige keyfile
# 400/owner mongo) antes do mongod. O volume de dados e — só no mongo-1 — as credenciais root
# (env + secret, que disparam o initdb do usuário admin) ficam por-instância.
x-mongo-node: &mongo-node
  image: mongo:8.2
  <<: *res-app
  entrypoint:
    - bash
    - -c
    - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
  healthcheck:
    <<: *hc
    test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
  restart: unless-stopped

# Template comum dos 3 nós de dados Redis. O `command` por-instância acrescenta --replicaof nas
# réplicas. requirepass + masterauth obrigatórios em TODOS os nós:
#   requirepass: autenticação de clientes (Spring, redis-cli, exporter).
#   masterauth: autenticação de réplicas → master (e do ex-master ao reintegrar pós-failover —
#   sem ela: PSYNC NOAUTH silencioso). Senha lida do secret ($$ → $).
x-redis-node: &redis-node
  image: redis:7
  <<: *res-redis
  entrypoint: ["sh", "-c"]
  secrets:
    - REDIS_PASSWORD
  healthcheck:
    <<: *hc
    # REDISCLI_AUTH é honrado pelo redis-cli 7, evitando NOAUTH no ping.
    test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli ping | grep -q PONG"]
  restart: unless-stopped

networks:
  # Rede única implícita: todo serviço entra na `default`. `name:` fixa o nome físico
  # (sem o prefixo de projeto), mantendo-o estável e referenciável.
  default:
    name: user-service-net
    driver: bridge

volumes:
  mongo_1_data:
  mongo_2_data:
  mongo_3_data:
  auth_db_data:

# Docker secrets (0.3 RELATORIOA): segredos fora do .env plano, montados em /run/secrets/<NOME>.
# Gere os arquivos uma vez com `infra/secrets/gen-secrets.sh` antes do `docker compose up`
# (./secrets/ é gitignorado). Consumo por serviço:
#   - Spring (config/discovery/auth/user/gateway): spring.config.import=configtree:/run/secrets/
#     (o nome do arquivo é exatamente o placeholder ${...} resolvido na config servida)
#   - postgres / mongo: convenção nativa *_FILE da imagem oficial
#   - redis / sentinel: command/healthcheck leem o arquivo via $(cat ...)
#   - grafana: GF_SECURITY_ADMIN_PASSWORD__FILE ; prometheus: basic_auth.password_file
# Resíduo consciente: o mongodb-exporter (distroless, sem shell/flag de arquivo) segue lendo
# MONGO_USER/MONGO_PASSWORD do .env — ver docs/SECURITY.md.
secrets:
  CONFIG_SERVER_PASSWORD:
    file: ./secrets/CONFIG_SERVER_PASSWORD
  REDIS_PASSWORD:
    file: ./secrets/REDIS_PASSWORD
  OAUTH_CLIENT_SECRET:
    file: ./secrets/OAUTH_CLIENT_SECRET
  INTERNAL_API_TOKEN:
    file: ./secrets/INTERNAL_API_TOKEN
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  MONGO_PASSWORD:
    file: ./secrets/MONGO_PASSWORD
  MONGODB_URI:
    file: ./secrets/MONGODB_URI
  GRAFANA_ADMIN_PASSWORD:
    file: ./secrets/GRAFANA_ADMIN_PASSWORD
  # notification-service (ADR-015): placeholders de dev sem credenciais reais.
  SMTP_HOST:
    file: ./secrets/SMTP_HOST
  SMTP_PORT:
    file: ./secrets/SMTP_PORT
  SMTP_USERNAME:
    file: ./secrets/SMTP_USERNAME
  SMTP_PASSWORD:
    file: ./secrets/SMTP_PASSWORD
  SMTP_AUTH:
    file: ./secrets/SMTP_AUTH
  SMTP_STARTTLS:
    file: ./secrets/SMTP_STARTTLS
  # Mutuamente exclusivo com SMTP_STARTTLS: 587 = STARTTLS, 465 = SSL implícito.
  SMTP_SSL_ENABLE:
    file: ./secrets/SMTP_SSL_ENABLE
  jwk_private:
    file: ./secrets/jwk_private
  jwk_public:
    file: ./secrets/jwk_public
  # JSON {target: senha} exigido pela flag --redis.password-file do redis_exporter (multi-target).
  redis_exporter_json:
    file: ./secrets/redis_exporter_json

services:

  # ──────────────────────────────────────────────
  # Observabilidade
  # ──────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin:latest
    <<: *res-half
    # Sem ports: aqui na base — observabilidade só na rede interna (G2). Republicado em loopback
    # pelo override (dev) e pelo overlay de deploy.
    environment:
      # Storage do Zipkin: in-memory por default (dev) — traces somem no restart. Em prod, setar
      # ZIPKIN_STORAGE_TYPE=elasticsearch + ZIPKIN_ES_HOSTS/USERNAME/PASSWORD apontando para um
      # Elasticsearch externo (persistência após restart). Ver docs/CONFIG.md § Observabilidade e
      # .env.example. As chaves do container são os nomes nativos do Zipkin.
      STORAGE_TYPE: ${ZIPKIN_STORAGE_TYPE:-mem}
      ES_HOSTS: ${ZIPKIN_ES_HOSTS:-}
      ES_USERNAME: ${ZIPKIN_ES_USERNAME:-}
      ES_PASSWORD: ${ZIPKIN_ES_PASSWORD:-}
    healthcheck:
      <<: *hc
      test: ["CMD", "wget", "--spider", "http://localhost:9411/health"]
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Config Server — eixo REPLICÁVEL (ADR-024): 1 instância no piso, N por --scale
  # ──────────────────────────────────────────────

  # Serviço ÚNICO e escalável, e não mais o par nomeado config-server-1/config-server-2.
  # Por que mudou (ADR-024): sendo stateless (qualquer instância serve o mesmo
  # classpath:/config), o config-server pertence ao eixo replicável — quantidade é
  # `--scale config-server=N`, não linha nova no compose. O par nomeado custava duas coisas:
  #   (a) BLOQUEAVA O PISO MÍNIMO — o `upstream` estático do config-lb listava os dois nomes, e
  #       o nginx recusa iniciar se um deles não resolve ("host not found in upstream");
  #   (b) passar de 2 exigia editar arquivo, em vez de um argumento de linha de comando.
  # NÃO acrescente container_name nem ports: aqui — qualquer um dos dois quebra o --scale.
  config-server:
    build: ./config-server
    <<: *res-mid
    environment:
      SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      # CONFIG_SERVER_PASSWORD via Docker secret (configtree:/run/secrets/) — fora do .env (0.3).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - CONFIG_SERVER_PASSWORD
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
    stop_grace_period: 35s
    restart: unless-stopped

  config-lb:
    image: nginx:alpine
    <<: *res-tiny
    # Sem ports: em prod — config-server não publicado (G3). Republicado em dev no override.
    volumes:
      - ./infra/config-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Uma entrada só: com --scale, o Compose espera TODAS as réplicas ficarem healthy.
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Eureka HA (2 instâncias em peer replication)
  # ──────────────────────────────────────────────

  # discovery-server-2 reaproveita o scaffold (<<: *discovery) e só sobrescreve a env
  # (porta/hostname/peer apontando para o par) e a porta do healthcheck.
  discovery-server-1: &discovery
    build: ./discovery-server
    <<: *res-mid
    # Sem ports: em prod — Eureka só na rede interna (G2). Republicado em dev no override.
    depends_on:
      config-lb:
        condition: service_healthy
    environment:
      <<: *spring-config
      SERVER_PORT: 9091
      EUREKA_HOSTNAME: discovery-server-1
      # Aponta para o PAR, não para si mesmo — e isso é obrigatório, não preferência.
      #
      # A tentação (ADR-024, corrigida na verificação) é auto-referenciar no piso mínimo para não
      # registrar falha de replicação contra um peer que não existe, deixando o discovery-server-2
      # apontar para cá e se manter atualizado por fetch. NÃO FUNCIONA: o fetch client-side de um
      # servidor Eureka popula o cache que ele usa como CLIENTE, não o registry que ele SERVE a
      # terceiros. Medido: com a auto-referência, o discovery-server-2 servia um registry sem
      # AUTHORIZATION-SERVER, e todo gateway que buscasse nele respondia 503 em /login
      # ("No servers available for service: authorization-server"). Replicação de peer no Eureka é
      # push; sem esta linha, o nó 2 nunca recebe o push.
      #
      # O custo é WARN de replicação no piso mínimo, onde o peer não existe: MEDIDO em ~11
      # linhas/min (ReplicationTaskProcessor + RetryableEurekaHttpClient). Deliberadamente NÃO
      # silenciado — é exatamente a mensagem que denuncia falha de replicação no piso `ha`, e
      # suprimi-la esconderia o bug acima em vez de corrigi-lo. A polaridade importa: o default
      # errado quebra o sistema, o default barulhento só incomoda. Quem roda o piso mínimo e quer
      # silêncio faz opt-in explícito: EUREKA_PEER_URL=http://discovery-server-1:9091/eureka
      # (auto-referência) — seguro SÓ com um nó, e catastrófico com dois.
      EUREKA_PEER_URL: ${EUREKA_PEER_URL:-http://discovery-server-2:9092/eureka}
    secrets:
      - CONFIG_SERVER_PASSWORD
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
    stop_grace_period: 35s
    restart: unless-stopped

  # Só com --profile ha (ADR-024). Réplica NOMEADA, não replicável por --scale: peers Eureka
  # precisam de identidade (EUREKA_HOSTNAME) e porta próprias.
  discovery-server-2:
    <<: *discovery
    profiles: ["ha"]
    environment:
      <<: *spring-config
      SERVER_PORT: 9092
      EUREKA_HOSTNAME: discovery-server-2
      EUREKA_PEER_URL: http://discovery-server-1:9091/eureka
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:9092/actuator/health"]

  # ──────────────────────────────────────────────
  # MongoDB Replica Set (3 nós + init)
  # ──────────────────────────────────────────────

  mongo-1:
    <<: *mongo-node
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_1_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      # Senha via Docker secret (convenção *_FILE nativa da imagem mongo) — fora do .env (0.3).
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/MONGO_PASSWORD
    secrets:
      - MONGO_PASSWORD

  # mongo-2/3 só existem com --profile ha (ADR-024). O piso mínimo roda rs0 com UM membro —
  # replica set degenerado, e não Mongo standalone, para que a MONGODB_URI dos clientes
  # (replicaSet=rs0) seja IDÊNTICA nos dois extremos. Crescer não reconfigura cliente nenhum.
  mongo-2:
    <<: *mongo-node
    profiles: ["ha"]
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_2_data:/data/db

  mongo-3:
    <<: *mongo-node
    profiles: ["ha"]
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_3_data:/data/db

  mongo-init:
    image: mongo:8.2
    cpus: 0.5
    mem_limit: 256m
    # SÓ mongo-1: a invariante de profile do ADR-024 é que nenhum serviço fora do profile pode
    # depender de um serviço dentro dele (o comportamento de depends_on → serviço com profile
    # inativo variou entre versões do Compose; obedecer à regra torna a questão irrelevante).
    # Se mongo-2/3 ainda não estiverem prontos no primeiro ciclo, o restart: on-failure repete.
    depends_on:
      mongo-1:
        condition: service_healthy
    secrets:
      - MONGO_PASSWORD
    environment:
      # Senha vem do secret (lida pelo script); o usuário não é segredo e vem do .env.
      MONGO_USER: ${MONGO_USER}
    volumes:
      # Mount :ro simples é adequado AQUI porque o script não é reescrito em runtime — o padrão
      # copy-to-/tmp vale para config que o próprio processo muta (sentinel.conf, keyfile).
      - ./infra/mongo/rs-reconcile.sh:/opt/rs-reconcile.sh:ro
    # Reconciliador idempotente: initiate se novo, rs.reconfig aditivo se já iniciado. Descobre
    # os membros por DNS, então --profile ha sozinho faz o replica set crescer. Ver o cabeçalho
    # do script para o racional completo.
    entrypoint: ["bash", "/opt/rs-reconcile.sh"]
    restart: on-failure

  # ──────────────────────────────────────────────
  # Redis Sentinel (3 nós + 3 sentinels)
  # ──────────────────────────────────────────────

  redis-1:
    <<: *redis-node
    command:
      - exec redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)" --masterauth "$$(cat /run/secrets/REDIS_PASSWORD)"

  # redis-2/3 e sentinel-2/3 só existem com --profile ha (ADR-024). O piso mínimo mantém o
  # Sentinel (com um nó) em vez de falar direto com o Redis: assim spring.data.redis.sentinel.*
  # dos clientes — e a invariante das DUAS senhas do ADR-008 — valem sem emenda nos dois extremos.
  redis-2:
    <<: *redis-node
    profiles: ["ha"]
    command:
      - exec redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)" --masterauth "$$(cat /run/secrets/REDIS_PASSWORD)" --replicaof redis-1 6379
    depends_on:
      redis-1:
        condition: service_healthy

  redis-3:
    <<: *redis-node
    profiles: ["ha"]
    command:
      - exec redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)" --masterauth "$$(cat /run/secrets/REDIS_PASSWORD)" --replicaof redis-1 6379
    depends_on:
      redis-1:
        condition: service_healthy

  # redis-sentinel-2/3 são idênticos: aliasam a âncora inteira (<<: *redis-sentinel).
  redis-sentinel-1: &redis-sentinel
    image: redis:7
    <<: *res-small
    # Padrão copy-to-/tmp (invariante — sentinel regrava o arquivo em runtime):
    # 1. Copia o conf :ro para /tmp/sentinel.conf (gravável pelo sentinel).
    # 2. Injeta requirepass (autenticação de clientes ao sentinel) e sentinel auth-pass
    #    (autenticação do sentinel ao data node monitorado), lidos do Docker secret ($$ → $).
    entrypoint: ["sh", "-c"]
    command:
      - >
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
        echo "requirepass $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass mymaster $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        exec redis-sentinel /tmp/sentinel.conf
    secrets:
      - REDIS_PASSWORD
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    # SÓ redis-1 (invariante de profile do ADR-024, ver mongo-init). Esperar pelas réplicas nunca
    # foi necessário: o Sentinel descobre réplicas sozinho, pelo INFO do master.
    depends_on:
      redis-1:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli -p 26379 ping | grep -q PONG"]
    restart: unless-stopped

  redis-sentinel-2:
    <<: *redis-sentinel
    profiles: ["ha"]

  redis-sentinel-3:
    <<: *redis-sentinel
    profiles: ["ha"]

  # ──────────────────────────────────────────────
  # PostgreSQL (estado OAuth — sem SPOF identificado)
  # ──────────────────────────────────────────────

  auth-postgres:
    image: postgres:16
    <<: *res-mid
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER}
      # Senha via Docker secret (convenção *_FILE nativa da imagem postgres) — fora do .env (0.3).
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d authdb"]
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Serviços de aplicação
  # ──────────────────────────────────────────────

  authorization-server:
    build: ./authorization-server
    <<: *res-jvm
    # Sem ports: em prod. O front-channel (browser → /oauth2/authorize, /login, /connect/logout)
    # é exposto pelo reverse-proxy de TLS/ingress (G1) num hostname dedicado (ex.: auth.<dominio>),
    # restrito a esses paths — não pela publicação da porta inteira. Em dev, o override republica 8082.
    # Só os nós do piso mínimo (invariante de profile do ADR-024): nenhum serviço fora do
    # profile `ha` pode declarar depends_on para um serviço dentro dele. Um discovery e um
    # sentinel bastam para subir; os nós do profile entram em cena sozinhos quando existem.
    depends_on:
      discovery-server-1:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    environment:
      # *spring-app-env traz CONFIG_SERVER_URL/USERNAME, SPRING_CONFIG_IMPORT (configtree + config-lb),
      # EUREKA_URI, tracing Zipkin e os sentinels Redis. O configtree injeta os segredos do auth-server:
      # CONFIG_SERVER_PASSWORD, OAUTH_CLIENT_SECRET, INTERNAL_API_TOKEN, REDIS_PASSWORD, AUTH_DB_PASSWORD.
      <<: *spring-app-env
      SERVER_PORT: 8082
      CORS_ALLOWED_ORIGINS_AUTH: ${CORS_ALLOWED_ORIGINS_AUTH:-http://localhost:8081}
      # Issuer do JWT. Externalizado, mas o default INTERNO é o valor correto em praticamente todo
      # cenário: tem de casar com o AUTH_ISSUER_URI dos resource servers (gateway e user-service),
      # que validam o token pela rede Docker. Sob Cloudflare Tunnel ele NÃO vira a origem pública.
      AUTH_ISSUER: ${AUTH_ISSUER:-http://authorization-server:8082}
      # redirectUri/postLogoutRedirectUri semeados no gateway-client (OAuth2ClientConfig).
      # Em prod, aponte para o domínio público real (CSV). Trocar exige re-seed do
      # gateway-client no Postgres — o seed é idempotente, não reconcilia cliente existente.
      OAUTH_CLIENT_REDIRECT_URIS: ${OAUTH_CLIENT_REDIRECT_URIS:-http://localhost:8081/login/oauth2/code/gateway-client,http://localhost:5173/login/oauth2/code/gateway-client,http://localhost:8081/swagger-ui/oauth2-redirect.html,https://oauth.pstmn.io/v1/callback}
      OAUTH_CLIENT_POST_LOGOUT_URIS: ${OAUTH_CLIENT_POST_LOGOUT_URIS:-http://localhost:5173/}
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/authdb
      AUTH_DB_USER: ${POSTGRES_USER}
      # Conexões JDBC por réplica (ADR-024). Espelha o default do authorization-server.yml.
      # N réplicas × este valor tem de caber no max_connections do Postgres (default 100).
      AUTH_DB_POOL_SIZE: ${AUTH_DB_POOL_SIZE:-8}
      # Chave de assinatura JWT via Docker secret (0.1) — fora do repo e do .env.
      JWK_PRIVATE_KEY: file:/run/secrets/jwk_private
      JWK_PUBLIC_KEY: file:/run/secrets/jwk_public
      # `kid` do par RSA. Estável de propósito (ADR-005) — trocar invalida os JWTs em circulação.
      JWK_KEY_ID: ${JWK_KEY_ID:-user-service-key}
      # Lockout anti-brute-force por par (conta, IP) — ADR-010.
      LOCKOUT_MAX_ATTEMPTS: ${LOCKOUT_MAX_ATTEMPTS:-5}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-15m}
      # Carência do gate de e-mail verificado no login, contada da data de cadastro (ADR-015):
      # evita conta permanentemente inacessível se o e-mail nunca chegar.
      EMAIL_VERIFICATION_GRACE_PERIOD: ${EMAIL_VERIFICATION_GRACE_PERIOD:-24h}
      # Purga do estado OAuth expirado (ADR-022). Sem ela a tabela oauth2_authorization cresce
      # uma linha por login, para sempre — o SAS nunca apaga nenhuma.
      OAUTH_STATE_PURGE_INTERVAL: ${OAUTH_STATE_PURGE_INTERVAL:-6h}
      OAUTH_STATE_PURGE_GRACE: ${OAUTH_STATE_PURGE_GRACE:-1d}
      OAUTH_STATE_PURGE_BATCH_SIZE: ${OAUTH_STATE_PURGE_BATCH_SIZE:-500}
    secrets:
      - CONFIG_SERVER_PASSWORD
      - OAUTH_CLIENT_SECRET
      - INTERNAL_API_TOKEN
      - REDIS_PASSWORD
      # A senha do Postgres entra com o nome do placeholder do auth-server (AUTH_DB_PASSWORD).
      - source: POSTGRES_PASSWORD
        target: AUTH_DB_PASSWORD
      - jwk_private
      - jwk_public
    healthcheck:
      <<: *hc
      # Actuator do auth-server vive na porta de management interna (8181), não na 8082.
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
    stop_grace_period: 35s
    restart: unless-stopped

  user-service:
    build: ./user-service
    <<: *res-jvm
    # Sem ports: em prod — acesso só via gateway (G2: 8090 direto contorna rate limit/CORS).
    # Republicado em dev no override.
    # Só os nós do piso mínimo (invariante de profile do ADR-024, ver auth-server). O gate real
    # continua sendo mongo-init: ele é quem garante que rs0 está formado — com 1 ou 3 membros.
    depends_on:
      discovery-server-1:
        condition: service_healthy
      mongo-1:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis-sentinel-1:
        condition: service_healthy
    environment:
      # *spring-app-env (ver auth-server). O configtree injeta os segredos do user-service:
      # CONFIG_SERVER_PASSWORD, REDIS_PASSWORD, INTERNAL_API_TOKEN e MONGODB_URI (URI completa).
      <<: *spring-app-env
      SERVER_PORT: 8090
      MONGODB_DATABASE: user-db
      # Teto de conexões Mongo por réplica (ADR-024). Espelha o default do user-service.yml.
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-50}
      AUTH_ISSUER_URI: http://authorization-server:8082
      AUTH_URL: ${AUTH_URL:-http://localhost:8082/oauth2/authorize}
      AUTH_TOKEN: ${AUTH_TOKEN:-http://localhost:8082/oauth2/token}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      # Versão dos termos gravada em cada cadastro (ADR-012). BUMPE quando a política mudar: é o
      # que prova qual texto cada titular aceitou e permite exigir re-consentimento.
      TERMS_VERSION: ${TERMS_VERSION:-v1}
      # Retenção da trilha de auditoria LGPD (ADR-022). Vale para as entradas gravadas daqui em
      # diante; as anteriores a esta mudança não têm purgeAt e nunca expiram.
      AUDIT_LOG_RETENTION: ${AUDIT_LOG_RETENTION:-180d}
      # TTL do epoch de revogação por usuário no Redis (ADR-017). Deve cobrir a validade máxima
      # de um access token, senão o epoch expira antes do token que ele deveria barrar.
      TOKEN_REVOCATION_TTL: ${TOKEN_REVOCATION_TTL:-75m}
      # Verificação de e-mail (ADR-015): TTL do token, limite de reenvio por conta e retenção do
      # outbox. As três chaves RETRY_* governam a varredura do OutboxRetryService.
      EMAIL_VERIFICATION_TOKEN_TTL: ${EMAIL_VERIFICATION_TOKEN_TTL:-15m}
      EMAIL_VERIFICATION_RESEND_MAX: ${EMAIL_VERIFICATION_RESEND_MAX:-3}
      EMAIL_VERIFICATION_RESEND_WINDOW: ${EMAIL_VERIFICATION_RESEND_WINDOW:-1h}
      EMAIL_VERIFICATION_OUTBOX_RETENTION: ${EMAIL_VERIFICATION_OUTBOX_RETENTION:-30d}
      EMAIL_VERIFICATION_RETRY_INTERVAL: ${EMAIL_VERIFICATION_RETRY_INTERVAL:-5m}
      EMAIL_VERIFICATION_RETRY_BACKOFF: ${EMAIL_VERIFICATION_RETRY_BACKOFF:-15m}
      EMAIL_VERIFICATION_RETRY_MAX_ATTEMPTS: ${EMAIL_VERIFICATION_RETRY_MAX_ATTEMPTS:-5}
    secrets:
      - CONFIG_SERVER_PASSWORD
      - REDIS_PASSWORD
      - INTERNAL_API_TOKEN
      - MONGODB_URI
    healthcheck:
      <<: *hc
      # Actuator do user-service vive na porta de management interna (8181), não na 8090.
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
    stop_grace_period: 35s
    restart: unless-stopped

  # notification-service (ADR-015): stateless (sem Mongo/Redis/Postgres) — só SMTP externo.
  # Sem ports: nunca exposto pelo gateway, só acessível internamente via Eureka/Feign
  # (canal /internal/**, X-Internal-Token). O user-service NÃO depende de service_healthy
  # aqui (chamada assíncrona com circuit breaker — indisponibilidade não pode travar o
  # cadastro), e este serviço também não depende do user-service.
  notification-service:
    build: ./notification-service
    <<: *res-jvm
    # Só o discovery do piso mínimo (invariante de profile do ADR-024, ver auth-server).
    depends_on:
      discovery-server-1:
        condition: service_healthy
    environment:
      <<: *spring-app-env
      SERVER_PORT: 8095
      # Remetente exibido nos e-mails de verificação. Os demais SMTP_* (host/porta/credenciais)
      # chegam por Docker secret via configtree — estes três timeouts, não: são de socket, não
      # segredo, e sem eles o default do Jakarta Mail é INFINITO (thread do Tomcat presa para
      # sempre num SMTP travado). Valores em ms.
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@users.local}
      SMTP_CONNECTION_TIMEOUT: ${SMTP_CONNECTION_TIMEOUT:-10000}
      SMTP_READ_TIMEOUT: ${SMTP_READ_TIMEOUT:-10000}
      SMTP_WRITE_TIMEOUT: ${SMTP_WRITE_TIMEOUT:-10000}
    secrets:
      - CONFIG_SERVER_PASSWORD
      - INTERNAL_API_TOKEN
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_AUTH
      - SMTP_STARTTLS
      - SMTP_SSL_ENABLE
    healthcheck:
      <<: *hc
      # Actuator do notification-service vive na porta de management interna (8181),
      # não na 8095. Este health fica 503 enquanto o SMTP for placeholder
      # (MailHealthIndicator) — sintoma conhecido, ninguém depende do health dele.
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
    stop_grace_period: 35s
    restart: unless-stopped

  gateway:
    build: ./gateway
    <<: *res-jvm
    # ports: movido para docker-compose.override.yml (G10 / ADR-019).
    # Na base prod-safe o gateway NÃO é publicado no host — apenas o nginx do SPA
    # (via cloudflared) alcança gateway:8081 pela rede interna Docker.
    # Só os nós do piso mínimo (invariante de profile do ADR-024, ver auth-server).
    depends_on:
      discovery-server-1:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
    environment:
      # *spring-app-env (ver auth-server). O configtree injeta os segredos do gateway:
      # CONFIG_SERVER_PASSWORD, OAUTH_CLIENT_SECRET e REDIS_PASSWORD.
      <<: *spring-app-env
      SERVER_PORT: 8081
      AUTH_ISSUER_URI: http://authorization-server:8082
      OAUTH_AUTHORIZATION_URI: ${OAUTH_AUTHORIZATION_URI:-http://localhost:8082/oauth2/authorize}
      # OAUTH2SWAGGER_REDIRECT_URL removida (ADR-020): alimentava springdoc.swagger-ui
      # .oauth2-redirect-url, que saiu junto com o bloco `oauth` do gateway.yml — nenhum
      # serviço a lê mais. O Swagger autentica pela sessão do BFF, sem botão Authorize.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OAUTH_CLIENT_ID: gateway-client
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/login/oauth2/code/gateway-client}
      # RP-Initiated Logout (lidos em gateway SecurityConfig via @Value). Em prod, hostnames
      # públicos reais — sem isto, o logout front-channel volta a localhost.
      OAUTH_END_SESSION_URI: ${OAUTH_END_SESSION_URI:-http://localhost:8082/connect/logout}
      POST_LOGOUT_REDIRECT_URI: ${POST_LOGOUT_REDIRECT_URI:-http://localhost:5173/}
      AUTH_URL: ${AUTH_URL:-http://localhost:8082/oauth2/authorize}
      AUTH_TOKEN: ${AUTH_TOKEN:-http://localhost:8082/oauth2/token}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      # Regex (ancorada, Pattern.matches) do peer imediato aceito como proxy confiável. Sem esta
      # propriedade o SCG 5.0.0 não registra XForwardedHeadersFilter/ForwardedHeadersFilter
      # (ADR-019). Aspas SIMPLES no YAML: o valor tem `\.`, que em aspas duplas o YAML leria como
      # escape inválido. Seguro só com G10 fechado (gateway não publicado na base).
      GATEWAY_TRUSTED_PROXIES: '${GATEWAY_TRUSTED_PROXIES:-10\..*|172\.(1[6-9]|2[0-9]|3[01])\..*|192\.168\..*}'
    secrets:
      - CONFIG_SERVER_PASSWORD
      - OAUTH_CLIENT_SECRET
      - REDIS_PASSWORD
    healthcheck:
      <<: *hc
      # Actuator do gateway vive na porta de management interna (8181), não na 8081 pública.
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
    stop_grace_period: 35s
    restart: unless-stopped

  interface:
    build:
      context: ./login-interface
      args:
        VITE_API_URL: ""
    # NÃO usa *res-tiny: sob hostname único este nginx é o funil de 100% do tráfego público
    # (o túnel entrega aqui, não no gateway), e era o componente de MENOR quota do compose —
    # 0.25 CPU para o único salto que toda requisição atravessa.
    cpus: 1.0
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      # Aciona /docker-entrypoint.d/30-tune-worker-processes.sh da imagem oficial: ele lê a
      # quota de CPU do cgroup e reescreve `worker_processes` de acordo. Sem isto vale o
      # `auto` do nginx.conf, que conta as CPUs do HOST e ignora a quota — medidos 12 workers
      # disputando uma fração de núcleo, puro custo de troca de contexto.
      # Derivar da quota (em vez de fixar um número) mantém os dois em sincronia se o `cpus`
      # acima mudar. NÃO passe worker_processes via `-g` no CMD: o nginx.conf base já declara
      # a diretiva e o nginx aborta com "directive is duplicate".
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    # ports: movido para docker-compose.override.yml (G10 / ADR-019).
    # Na base prod-safe a interface NÃO é publicada no host — o cloudflared alcança
    # interface:80 pela rede interna Docker. Em dev o override republica via WEB_HOST_PORT.

  # ──────────────────────────────────────────────
  # Observabilidade (métricas)
  # ──────────────────────────────────────────────

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    <<: *res-small
    # Sem ports: em prod — exporters só na rede interna. Republicado em dev no override se necessário.
    # RESÍDUO 0.3: imagem distroless (sem shell) e sem flag de arquivo para a URI → a credencial
    # do Mongo continua vindo do ambiente (MONGO_USER/MONGO_PASSWORD do .env). Dívida em SECURITY.md.
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-1:27017/?replicaSet=rs0&authSource=admin
    command:
      - --collect-all
      - --discovering-mode
    # Só mongo-1 + o init (invariante de profile do ADR-024). O --discovering-mode do exporter
    # descobre os demais membros do rs0 sozinho, quando existirem.
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    <<: *res-small
    # Sem ports: em prod — exporters só na rede interna.
    # A imagem tem shell: monta o DATA_SOURCE_NAME lendo a senha do Docker secret ($$ → $) e
    # exec o binário — credencial fora do .env (0.3). Usuário (não-segredo) vem do .env.
    entrypoint: ["sh", "-c"]
    command:
      - export DATA_SOURCE_NAME="postgresql://${POSTGRES_USER}:$$(cat /run/secrets/POSTGRES_PASSWORD)@auth-postgres:5432/authdb?sslmode=disable" && exec /bin/postgres_exporter
    secrets:
      - POSTGRES_PASSWORD
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    <<: *res-small
    # Sem ports: em prod — exporters só na rede interna.
    # Modo multi-target: REDIS_ADDR não definido; o alvo concreto vem do Prometheus via ?target=.
    # --redis.password-file espera um JSON {target: senha}, não a senha crua — por isso o secret
    # dedicado redis_exporter_json (gen-secrets.sh) mapeia os 6 alvos à REDIS_PASSWORD uniforme,
    # mantendo a credencial fora do .env (0.3).
    command:
      - --redis.password-file=/run/secrets/redis_exporter_json
    secrets:
      - redis_exporter_json
    # Só redis-1 (invariante de profile do ADR-024). O exporter é multi-target por /scrape: os
    # alvos vêm do Prometheus, e os do profile `ha` simplesmente reportam down enquanto não sobem.
    depends_on:
      redis-1:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    <<: *res-half
    # Sem ports: aqui na base — métricas só na rede interna (G2/G6). Republicado em loopback pelo
    # override (dev) e pelo overlay de deploy.
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    # basic_auth do scrape do config-server lê a senha do Docker secret (password_file) — 0.3.
    secrets:
      - CONFIG_SERVER_PASSWORD
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    # Sem ports: em prod — dashboards só na rede interna (G2/G11). Republicado em dev no override.
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    # Senha do admin via Docker secret (convenção __FILE nativa do Grafana) — fora do .env (0.3).
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/GRAFANA_ADMIN_PASSWORD
    secrets:
      - GRAFANA_ADMIN_PASSWORD
    restart: unless-stopped
