version: "3.9"

networks:
  user-service-net:
    driver: bridge

volumes:
  mongo_1_data:
  mongo_2_data:
  mongo_3_data:
  auth_db_data:

# Docker secrets (0.3 RELATORIOA): segredos fora do .env plano, montados em /run/secrets/<NOME>.
# Gere os arquivos uma vez com `infra/secrets/gen-secrets.sh` antes do `docker compose up`
# (./secrets/ é gitignorado). Consumo por serviço:
#   - Spring (config/discovery/auth/user/gateway): spring.config.import=configtree:/run/secrets/
#     (o nome do arquivo é exatamente o placeholder ${...} resolvido na config servida)
#   - postgres / mongo: convenção nativa *_FILE da imagem oficial
#   - redis / sentinel: command/healthcheck leem o arquivo via $(cat ...)
#   - grafana: GF_SECURITY_ADMIN_PASSWORD__FILE ; prometheus: basic_auth.password_file
# Resíduo consciente: o mongodb-exporter (distroless, sem shell/flag de arquivo) segue lendo
# MONGO_USER/MONGO_PASSWORD do .env — ver docs/SECURITY.md.
secrets:
  CONFIG_SERVER_PASSWORD:
    file: ./secrets/CONFIG_SERVER_PASSWORD
  REDIS_PASSWORD:
    file: ./secrets/REDIS_PASSWORD
  OAUTH_CLIENT_SECRET:
    file: ./secrets/OAUTH_CLIENT_SECRET
  INTERNAL_API_TOKEN:
    file: ./secrets/INTERNAL_API_TOKEN
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  MONGO_PASSWORD:
    file: ./secrets/MONGO_PASSWORD
  MONGODB_URI:
    file: ./secrets/MONGODB_URI
  GRAFANA_ADMIN_PASSWORD:
    file: ./secrets/GRAFANA_ADMIN_PASSWORD
  jwk_private:
    file: ./secrets/jwk_private
  jwk_public:
    file: ./secrets/jwk_public
  # JSON {target: senha} exigido pela flag --redis.password-file do redis_exporter (multi-target).
  redis_exporter_json:
    file: ./secrets/redis_exporter_json

services:

  # ──────────────────────────────────────────────
  # Observabilidade
  # ──────────────────────────────────────────────

  zipkin:
    image: openzipkin/zipkin:latest
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — observabilidade só na rede interna (G2). Republicado em dev no override.
    environment:
      # Storage do Zipkin: in-memory por default (dev) — traces somem no restart. Em prod, setar
      # ZIPKIN_STORAGE_TYPE=elasticsearch + ZIPKIN_ES_HOSTS/USERNAME/PASSWORD apontando para um
      # Elasticsearch externo (persistência após restart). Ver docs/CONFIG.md § Observabilidade e
      # .env.example. As chaves do container são os nomes nativos do Zipkin.
      STORAGE_TYPE: ${ZIPKIN_STORAGE_TYPE:-mem}
      ES_HOSTS: ${ZIPKIN_ES_HOSTS:-}
      ES_USERNAME: ${ZIPKIN_ES_USERNAME:-}
      ES_PASSWORD: ${ZIPKIN_ES_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9411/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Config Server HA (2 instâncias + nginx LB)
  # ──────────────────────────────────────────────

  config-server-1:
    build: ./config-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    environment:
      SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      # CONFIG_SERVER_PASSWORD via Docker secret (configtree:/run/secrets/) — fora do .env (0.3).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - CONFIG_SERVER_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  config-server-2:
    build: ./config-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    environment:
      SERVER_PORT: 8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
    secrets:
      - CONFIG_SERVER_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  config-lb:
    image: nginx:alpine
    cpus: 0.25
    mem_limit: 64m
    networks:
      - user-service-net
    # Sem ports: em prod — config-server não publicado (G3). Republicado em dev no override.
    volumes:
      - ./infra/config-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      config-server-1:
        condition: service_healthy
      config-server-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Eureka HA (2 instâncias em peer replication)
  # ──────────────────────────────────────────────

  discovery-server-1:
    build: ./discovery-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — Eureka só na rede interna (G2). Republicado em dev no override.
    depends_on:
      config-lb:
        condition: service_healthy
    environment:
      SERVER_PORT: 9091
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/,optional:configserver:http://config-lb:8888
      EUREKA_HOSTNAME: discovery-server-1
      EUREKA_PEER_URL: http://discovery-server-2:9092/eureka
    secrets:
      - CONFIG_SERVER_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  discovery-server-2:
    build: ./discovery-server
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — Eureka só na rede interna (G2). Republicado em dev no override.
    depends_on:
      config-lb:
        condition: service_healthy
    environment:
      SERVER_PORT: 9092
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/,optional:configserver:http://config-lb:8888
      EUREKA_HOSTNAME: discovery-server-2
      EUREKA_PEER_URL: http://discovery-server-1:9091/eureka
    secrets:
      - CONFIG_SERVER_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MongoDB Replica Set (3 nós + init)
  # ──────────────────────────────────────────────

  mongo-1:
    image: mongo:8.2
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    entrypoint:
      - bash
      - -c
      - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_1_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      # Senha via Docker secret (convenção *_FILE nativa da imagem mongo) — fora do .env (0.3).
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/MONGO_PASSWORD
    secrets:
      - MONGO_PASSWORD
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  mongo-2:
    image: mongo:8.2
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    entrypoint:
      - bash
      - -c
      - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  mongo-3:
    image: mongo:8.2
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    entrypoint:
      - bash
      - -c
      - "cp /tmp/keyfile /tmp/mongo.key && chmod 400 /tmp/mongo.key && chown 999:999 /tmp/mongo.key && exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo.key"
    volumes:
      - ./infra/mongo/keyfile:/tmp/keyfile:ro
      - mongo_3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  mongo-init:
    image: mongo:8.2
    cpus: 0.5
    mem_limit: 256m
    networks:
      - user-service-net
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
    secrets:
      - MONGO_PASSWORD
    # Senha lida do secret em runtime ($$ → $ no container). Usuário (não-segredo) vem do .env.
    entrypoint:
      - bash
      - -c
    # Folded scalar (>): TODAS as linhas com a MESMA indentação que `mongosh` — assim o YAML
    # dobra as quebras em espaços e o bash -c recebe UM comando só (linha mais indentada vira
    # newline literal e quebraria a invocação em comandos soltos).
    command:
      - >
        mongosh --host mongo-1:27017
        -u ${MONGO_USER} -p "$$(cat /run/secrets/MONGO_PASSWORD)"
        --authenticationDatabase admin
        --eval "try { rs.initiate({ _id: 'rs0', members: [ {_id: 0, host: 'mongo-1:27017'}, {_id: 1, host: 'mongo-2:27017'}, {_id: 2, host: 'mongo-3:27017'} ] }); print('Replica set iniciado'); } catch(e) { if (e.codeName === 'AlreadyInitialized') print('Replica set ja iniciado'); else throw e; }"
    restart: on-failure

  # ──────────────────────────────────────────────
  # Redis Sentinel (3 nós + 3 sentinels)
  # ──────────────────────────────────────────────

  redis-1:
    image: redis:7
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - user-service-net
    # requirepass: autenticação de clientes (Spring, redis-cli, exporter).
    # masterauth: autenticação de réplicas → master (e do master pós-failover ao reintegrar como réplica).
    # Ambas obrigatórias em TODOS os nós: sem masterauth no master atual, após um failover ele não
    # consegue reintegrar como réplica (PSYNC NOAUTH silencioso). Senha lida do secret ($$ → $).
    entrypoint: ["sh", "-c"]
    command:
      - exec redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)" --masterauth "$$(cat /run/secrets/REDIS_PASSWORD)"
    secrets:
      - REDIS_PASSWORD
    healthcheck:
      # REDISCLI_AUTH é honrado pelo redis-cli 7 (data node e sentinel), evitando NOAUTH no ping.
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-2:
    image: redis:7
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - user-service-net
    entrypoint: ["sh", "-c"]
    command:
      - exec redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)" --masterauth "$$(cat /run/secrets/REDIS_PASSWORD)" --replicaof redis-1 6379
    secrets:
      - REDIS_PASSWORD
    depends_on:
      redis-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-3:
    image: redis:7
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 64m
    networks:
      - user-service-net
    entrypoint: ["sh", "-c"]
    command:
      - exec redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)" --masterauth "$$(cat /run/secrets/REDIS_PASSWORD)" --replicaof redis-1 6379
    secrets:
      - REDIS_PASSWORD
    depends_on:
      redis-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Padrão copy-to-/tmp (invariante — sentinel regrava o arquivo em runtime):
    # 1. Copia o conf :ro para /tmp/sentinel.conf (gravável pelo sentinel).
    # 2. Injeta requirepass (autenticação de clientes ao sentinel) e sentinel auth-pass
    #    (autenticação do sentinel ao data node monitorado), lidos do Docker secret ($$ → $).
    entrypoint: ["sh", "-c"]
    command:
      - >
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
        echo "requirepass $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass mymaster $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        exec redis-sentinel /tmp/sentinel.conf
    secrets:
      - REDIS_PASSWORD
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli -p 26379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    entrypoint: ["sh", "-c"]
    command:
      - >
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
        echo "requirepass $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass mymaster $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        exec redis-sentinel /tmp/sentinel.conf
    secrets:
      - REDIS_PASSWORD
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli -p 26379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    entrypoint: ["sh", "-c"]
    command:
      - >
        cp /etc/redis/sentinel.conf /tmp/sentinel.conf &&
        echo "requirepass $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        echo "sentinel auth-pass mymaster $$(cat /run/secrets/REDIS_PASSWORD)" >> /tmp/sentinel.conf &&
        exec redis-sentinel /tmp/sentinel.conf
    secrets:
      - REDIS_PASSWORD
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$(cat /run/secrets/REDIS_PASSWORD) redis-cli -p 26379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL (estado OAuth — sem SPOF identificado)
  # ──────────────────────────────────────────────

  auth-postgres:
    image: postgres:16
    cpus: 0.75
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: ${POSTGRES_USER}
      # Senha via Docker secret (convenção *_FILE nativa da imagem postgres) — fora do .env (0.3).
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 25
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Serviços de aplicação
  # ──────────────────────────────────────────────

  authorization-server:
    build: ./authorization-server
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    # Sem ports: em prod. O front-channel (browser → /oauth2/authorize, /login, /connect/logout)
    # é exposto pelo reverse-proxy de TLS/ingress (G1) num hostname dedicado (ex.: auth.<dominio>),
    # restrito a esses paths — não pela publicação da porta inteira. Em dev, o override republica 8082.
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      # configtree:/run/secrets/ injeta os segredos (CONFIG_SERVER_PASSWORD, OAUTH_CLIENT_SECRET,
      # INTERNAL_API_TOKEN, REDIS_PASSWORD, AUTH_DB_PASSWORD) na config servida — fora do .env (0.3).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/,optional:configserver:http://config-lb:8888
      EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OAUTH_GATEWAY_CLIENT: ${OAUTH_GATEWAY_CLIENT:-http://localhost:8081/login/oauth2/code/gateway-client}
      OAUTH_SWAGGER_REDIRECT_URL: ${OAUTH_SWAGGER_REDIRECT_URL:-http://localhost:8081/swagger-ui/oauth2-redirect.html}
      CORS_ALLOWED_ORIGINS_AUTH: ${CORS_ALLOWED_ORIGINS_AUTH:-http://localhost:8081}
      AUTH_ISSUER: http://authorization-server:8082
      # redirectUri/postLogoutRedirectUri semeados no gateway-client (OAuth2ClientConfig).
      # Em prod, aponte para o domínio público real (CSV). Trocar exige re-seed do
      # gateway-client no Postgres — o seed é idempotente, não reconcilia cliente existente.
      OAUTH_CLIENT_REDIRECT_URIS: ${OAUTH_CLIENT_REDIRECT_URIS:-http://localhost:8081/login/oauth2/code/gateway-client,http://localhost:5173/login/oauth2/code/gateway-client,http://localhost:8081/swagger-ui/oauth2-redirect.html,https://oauth.pstmn.io/v1/callback}
      OAUTH_CLIENT_POST_LOGOUT_URIS: ${OAUTH_CLIENT_POST_LOGOUT_URIS:-http://localhost:5173/}
      AUTH_DB_URL: jdbc:postgresql://auth-postgres:5432/authdb
      AUTH_DB_USER: ${POSTGRES_USER}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      # Chave de assinatura JWT via Docker secret (0.1) — fora do repo e do .env.
      JWK_PRIVATE_KEY: file:/run/secrets/jwk_private
      JWK_PUBLIC_KEY: file:/run/secrets/jwk_public
    secrets:
      - CONFIG_SERVER_PASSWORD
      - OAUTH_CLIENT_SECRET
      - INTERNAL_API_TOKEN
      - REDIS_PASSWORD
      # A senha do Postgres entra com o nome do placeholder do auth-server (AUTH_DB_PASSWORD).
      - source: POSTGRES_PASSWORD
        target: AUTH_DB_PASSWORD
      - jwk_private
      - jwk_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  user-service:
    build: ./user-service
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    # Sem ports: em prod — acesso só via gateway (G2: 8090 direto contorna rate limit/CORS).
    # Republicado em dev no override.
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      # configtree:/run/secrets/ injeta CONFIG_SERVER_PASSWORD, REDIS_PASSWORD, INTERNAL_API_TOKEN
      # e MONGODB_URI (URI completa com credencial) na config servida — fora do .env (0.3).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/,optional:configserver:http://config-lb:8888
      EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      MONGODB_DATABASE: user-db
      AUTH_ISSUER_URI: http://authorization-server:8082
      AUTH_URL: ${AUTH_URL:-http://localhost:8082/oauth2/authorize}
      AUTH_TOKEN: ${AUTH_TOKEN:-http://localhost:8082/oauth2/token}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    secrets:
      - CONFIG_SERVER_PASSWORD
      - REDIS_PASSWORD
      - INTERNAL_API_TOKEN
      - MONGODB_URI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  gateway:
    build: ./gateway
    cpus: 1.0
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - user-service-net
    ports:
      - "8081:8081"
    depends_on:
      discovery-server-1:
        condition: service_healthy
      discovery-server-2:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      CONFIG_SERVER_URL: http://config-lb:8888
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME}
      # configtree:/run/secrets/ injeta CONFIG_SERVER_PASSWORD, OAUTH_CLIENT_SECRET e REDIS_PASSWORD
      # na config servida — fora do .env (0.3).
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/,optional:configserver:http://config-lb:8888
      EUREKA_URI: http://discovery-server-1:9091/eureka,http://discovery-server-2:9092/eureka
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      AUTH_ISSUER_URI: http://authorization-server:8082
      OAUTH_AUTHORIZATION_URI: ${OAUTH_AUTHORIZATION_URI:-http://localhost:8082/oauth2/authorize}
      OAUTH2SWAGGER_REDIRECT_URL: ${OAUTH2SWAGGER_REDIRECT_URL:-http://localhost:8081/swagger-ui/oauth2-redirect.html}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      OAUTH_CLIENT_ID: gateway-client
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/login/oauth2/code/gateway-client}
      # RP-Initiated Logout (lidos em gateway SecurityConfig via @Value). Em prod, hostnames
      # públicos reais — sem isto, o logout front-channel volta a localhost.
      OAUTH_END_SESSION_URI: ${OAUTH_END_SESSION_URI:-http://localhost:8082/connect/logout}
      POST_LOGOUT_REDIRECT_URI: ${POST_LOGOUT_REDIRECT_URI:-http://localhost:5173/}
      AUTH_URL: ${AUTH_URL:-http://localhost:8082/oauth2/authorize}
      AUTH_TOKEN: ${AUTH_TOKEN:-http://localhost:8082/oauth2/token}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8081}
      REDIS_SENTINEL_MASTER: mymaster
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    secrets:
      - CONFIG_SERVER_PASSWORD
      - OAUTH_CLIENT_SECRET
      - REDIS_PASSWORD
    healthcheck:
      # Actuator do gateway vive na porta de management interna (8181), não na 8081 pública.
      test: ["CMD", "curl", "-f", "http://localhost:8181/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 25
    stop_grace_period: 35s
    restart: unless-stopped

  interface:
    build:
      context: ./login-interface
      args:
        VITE_API_URL: ""
    cpus: 0.25
    mem_limit: 64m
    # Borda pública (SPA + proxy BFF). Porta do host por env (listas de ports: são concatenadas
    # entre base/override, então não dá para "remapear" via override): dev usa o default 5173
    # (URL documentada); prod seta WEB_HOST_PORT (ex.: 80, atrás do TLS/ingress — G1).
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    networks:
      - user-service-net

  # ──────────────────────────────────────────────
  # Observabilidade (métricas)
  # ──────────────────────────────────────────────

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — exporters só na rede interna. Republicado em dev no override se necessário.
    # RESÍDUO 0.3: imagem distroless (sem shell) e sem flag de arquivo para a URI → a credencial
    # do Mongo continua vindo do ambiente (MONGO_USER/MONGO_PASSWORD do .env). Dívida em SECURITY.md.
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-1:27017/?replicaSet=rs0&authSource=admin
    command:
      - --collect-all
      - --discovering-mode
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_healthy
      mongo-3:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — exporters só na rede interna.
    # A imagem tem shell: monta o DATA_SOURCE_NAME lendo a senha do Docker secret ($$ → $) e
    # exec o binário — credencial fora do .env (0.3). Usuário (não-segredo) vem do .env.
    entrypoint: ["sh", "-c"]
    command:
      - export DATA_SOURCE_NAME="postgresql://${POSTGRES_USER}:$$(cat /run/secrets/POSTGRES_PASSWORD)@auth-postgres:5432/authdb?sslmode=disable" && exec /bin/postgres_exporter
    secrets:
      - POSTGRES_PASSWORD
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    cpus: 0.25
    mem_limit: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — exporters só na rede interna.
    # Modo multi-target: REDIS_ADDR não definido; o alvo concreto vem do Prometheus via ?target=.
    # --redis.password-file espera um JSON {target: senha}, não a senha crua — por isso o secret
    # dedicado redis_exporter_json (gen-secrets.sh) mapeia os 6 alvos à REDIS_PASSWORD uniforme,
    # mantendo a credencial fora do .env (0.3).
    command:
      - --redis.password-file=/run/secrets/redis_exporter_json
    secrets:
      - redis_exporter_json
    depends_on:
      redis-1:
        condition: service_healthy
      redis-2:
        condition: service_healthy
      redis-3:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    networks:
      - user-service-net
    # Sem ports: em prod — métricas só na rede interna (G2/G6). Republicado em dev no override.
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    # basic_auth do scrape do config-server lê a senha do Docker secret (password_file) — 0.3.
    secrets:
      - CONFIG_SERVER_PASSWORD
    depends_on:
      - gateway
      - user-service
      - authorization-server
      - mongodb-exporter
      - postgres-exporter
      - redis-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - user-service-net
    # Sem ports: em prod — dashboards só na rede interna (G2/G11). Republicado em dev no override.
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    # Senha do admin via Docker secret (convenção __FILE nativa do Grafana) — fora do .env (0.3).
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/GRAFANA_ADMIN_PASSWORD
    secrets:
      - GRAFANA_ADMIN_PASSWORD
    restart: unless-stopped
