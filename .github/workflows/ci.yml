name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs obsoletos do mesmo ref (ex.: novos pushes num PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Back-end: um job por módulo Maven (não há POM-pai agregador, então
  # cada serviço é construído isoladamente). `mvn verify` dispara o gate
  # JaCoCo já plugado nessa fase. Testcontainers usa o Docker do runner.
  backend:
    name: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - config-server
          - discovery-server
          - authorization-server
          - user-service
          - gateway
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # A chave de assinatura JWT não é versionada (gap 0.1 RELATORIOA). O
      # authorization-server precisa de um par no classpath para os testes de
      # integração; geramos um par efêmero por run.
      - name: Gerar chave JWK efêmera (authorization-server)
        if: matrix.module == 'authorization-server'
        run: bash infra/jwk/gen-keys.sh authorization-server/src/main/resources/keys

      - name: mvn verify (${{ matrix.module }})
        working-directory: ${{ matrix.module }}
        run: mvn -B verify

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/target/surefire-reports
            ${{ matrix.module }}/target/failsafe-reports
            ${{ matrix.module }}/target/site/jacoco
          if-no-files-found: ignore

  # Front-end: testes Vitest com gate de cobertura (threshold 80% no
  # vitest.config.ts). Usa `npm run coverage`, não `npm test` (watch mode).
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: login-interface
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: login-interface/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: login-interface/coverage
          if-no-files-found: ignore

  # Validação estrutural da topologia do Compose base (prod-safe) a cada PR.
  compose-validate:
    name: compose-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide a dummy .env
        run: cp .env.example .env

      - name: Validate compose topology
        run: docker compose -f docker-compose.yml config -q

  # Smoke-test da topologia de login sob hostname único (ADR-023). Sobe nginx + gateway +
  # authorization-server (menos o cloudflared, que não roda em CI) e verifica por HTTP os pontos
  # exatos onde os elos do ADR-019 quebraram — todos descobertos em produção, nenhum pego antes
  # do deploy. É o único job que exercita o container `interface`: nem os Testcontainers nem o
  # compose-validate acima passam pelo nginx.
  #
  # Sem `needs:` — paralelo aos demais. Roda em todo push/PR: o CI não tem path-filtering em
  # nenhum job, e o filtro deixaria passar mudança indireta (ex.: em SecurityConfig) que também
  # afeta a cadeia (ADR-023 § Alternativas).
  smoke-test-login:
    name: smoke-test-login
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Envs no nível do JOB, não do passo: o passo de teardown abaixo também invoca `docker compose`
    # com o overlay de deploy, cujos `${PUBLIC_ORIGIN:?}` / `${TUNNEL_ID:?}` são interpolados na
    # leitura do arquivo — sem elas o próprio `down` falha.
    env:
      PUBLIC_ORIGIN: https://smoke-test.local
      PUBLIC_HOST: smoke-test.local
      TUNNEL_ID: 00000000-0000-0000-0000-000000000000
    steps:
      - uses: actions/checkout@v4

      # O script cuida de .env e ./secrets/ (defaults de dev) e derruba a stack ao final,
      # imprimindo `compose ps` + logs se alguma asserção reprovar.
      - name: Smoke-test da topologia de login
        run: bash infra/smoke-test/login-topology-smoke-test.sh

      # Rede de segurança para o caso de o script ser morto (timeout do job) antes do seu próprio
      # trap: `down -v` é idempotente, então rodar duas vezes não custa nada.
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml down -v
