# docker-compose.tls.yml — overlay OPT-IN de TLS na borda (dev, mkcert).
#
# Sobe um reverse-proxy nginx que termina TLS e fala HTTPS com o browser, mantendo
# o tráfego interno em HTTP. Espelha a topologia de produção (terminação na borda):
# ir para prod = trocar o cert do mkcert por um ACME/corporativo e os hostnames
# *.localhost por domínios reais.
#
# Pré-requisito (uma vez): ver docs/TLS_DEV.md (mkcert -install + gerar edge.crt/edge.key).
#
#   Subir:  docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#           (base prod-safe + este overlay; NÃO usa o docker-compose.override.yml,
#            então só a borda 443 fica exposta — fluxo prod-like)
#   Acesso: https://app.localhost  (SPA + API)
#           https://auth.localhost (front-channel OAuth2)
#
# O fluxo HTTP puro de dev segue intacto com `docker compose up` (base + override).

services:

  tls-proxy:
    build: ./infra/tls-proxy
    networks:
      - user-service-net
    ports:
      # Só 443. A 80 (redirect HTTP->HTTPS) NÃO é publicada: em muitas máquinas dev a
      # porta 80 do host já está ocupada (ex.: Apache/nginx local), e o conflito na
      # publicação quebra a criação do container. Acesse https://app.localhost direto.
      # Para habilitar o redirect, libere a 80 no host e re-adicione "80:80".
      - "443:443"
    volumes:
      - ./infra/tls-proxy/certs:/etc/nginx/certs:ro
    depends_on:
      authorization-server:
        condition: service_healthy
      gateway:
        condition: service_healthy
      interface:
        condition: service_started
    restart: unless-stopped

  # Front-channel e cookies do BFF passam a apontar para os hostnames HTTPS da borda.
  # O back-channel (AUTH_ISSUER_URI -> authorization-server:8082) permanece HTTP interno.
  gateway:
    environment:
      OAUTH_AUTHORIZATION_URI: https://auth.localhost/oauth2/authorize
      OAUTH_REDIRECT_URI: https://app.localhost/login/oauth2/code/gateway-client
      OAUTH_END_SESSION_URI: https://auth.localhost/connect/logout
      POST_LOGOUT_REDIRECT_URI: https://app.localhost/
      CORS_ALLOWED_ORIGINS: https://app.localhost
      API_BASE_URL: https://app.localhost
      # Honra X-Forwarded-Proto/Host do tls-proxy (scheme https no exchange reativo).
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Liga a flag Secure nos cookies SESSION e XSRF-TOKEN (atrás de proxy que
      # termina TLS, sslInfo é null, então a flag é explicitamente gated por env).
      APP_COOKIE_SECURE: "true"

  # Front-channel do auth-server atrás da borda. Honrar X-Forwarded-Proto dá o IP real
  # ao lockout C19 (X-Forwarded-For via ClientIpResolver).
  # CORS em CSV: SPA (app.localhost) + Swagger-UI (localhost:8081, fetch cross-origin
  # do /oauth2/token — a porta 8081 do gateway segue publicada no modo TLS).
  authorization-server:
    environment:
      CORS_ALLOWED_ORIGINS_AUTH: https://app.localhost,http://localhost:8081
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Liga a flag Secure no cookie AUTHSESSION (simétrico ao gateway: atrás de proxy
      # que termina TLS a flag é gated por env, não inferida do request.isSecure()).
      APP_COOKIE_SECURE: "true"

  # Swagger-UI (servido pelo gateway em http://localhost:8081): sem o override de dev a
  # porta 8082 não é publicada, então o fluxo OAuth2 do Swagger passa pela borda TLS.
  user-service:
    environment:
      AUTH_URL: https://auth.localhost/oauth2/authorize
      AUTH_TOKEN: https://auth.localhost/oauth2/token
